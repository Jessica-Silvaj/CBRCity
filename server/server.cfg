# ConfiguraÃ§Ãµes do servidor
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ConfiguraÃ§Ãµes do MySQL
# Credenciais (licença, MySQL, Steam, RCON) ficam em secrets.cfg, fora do git
exec secrets.cfg
set mysql_transaction_isolation_level 2
set mysql_slow_query_warning 10000

# Desligado: a base altera state bags pelo client (Safezone, Death, Handcuff...)
setr sv_stateBagStrictMode false
set ox:ignoreSecurityAdvisory ["stateBagStrictMode"]

# Usa o chat da base ([enchanted]/chat) e nÃ£o o chat padrÃ£o do FXServer
set resources_useSystemChat false

# Spectrem Director - acesso somente para administradores
set sv_enableNetEventReassembly true

# Iniciar resources
start vrp
start [system]
start [weapons]
start [enchanted]
start [empregos]
start [smartphone]
start [automated]
start [exclusive]
start [addons]
# Spectrem Director desativado
# ensure spectrem_director
# ensure spectrem_vrp_bridge

# ConfiguraÃ§Ãµes do servidor
sv_scriptHookAllowed 0
sets tags "rp, roleplay, cbr, cbrcity, enchanted, pvp, br, brasil, brazil, otimizado, fps, clean"
sets locale "pt-BR"
load_server_icon server.png
setr sv_showBusySpinnerOnLoadingScreen false

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="build/vendor/outfit.css">
    <link rel="stylesheet" href="fonts/cinematic/font-library.css">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            background: transparent; pointer-events: none; user-select: none;
        }
        #surface {
            width: 100%; height: 100%; padding: 10px 28px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; opacity: 0;
        }
        #text {
            width: 100%; max-height: 100%; margin: 0;
            font-family: "Outfit", Arial, sans-serif;
            font-size: 84px; font-weight: 700; line-height: 1.05;
            color: #fff; text-align: center; white-space: pre-wrap;
            overflow-wrap: anywhere; transform-origin: center;
        }
    </style>
</head>
<body>
    <main id="surface" aria-hidden="true"><div id="text" dir="auto"></div></main>
    <script>
        (() => {
            "use strict";
            const surface = document.getElementById("surface");
            const text = document.getElementById("text");
            const instanceId = Number(new URLSearchParams(location.search).get("instance"));
            const resource = location.hostname.startsWith("cfx-nui-")
                ? location.hostname.slice(8) : "";
            async function acknowledge(revision) {
                if (!resource || !instanceId) return;
                for (let attempt = 0; attempt < 20; attempt++) {
                    try {
                        const response = await fetch(`https://${resource}/sync_scenes:cinematicTextReady`, {
                            method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8" },
                            body: JSON.stringify({ instanceId, revision }),
                        });
                        if ((await response.json()).ok) return;
                    } catch (_) { /* The native instance may still be initializing. */ }
                    await new Promise(resolve => setTimeout(resolve, 250));
                }
            }
            const state = {
                visible: false,
                definition: null,
                content: "",
                segments: [],
                sampleTime: 0,
                sampleAt: performance.now(),
                duration: 1,
                paused: false,
                fontGeneration: 0,
            };

            const clamp = (value, min, max) => Math.min(max, Math.max(min, Number(value) || 0));
            const safeColor = (value, fallback) => /^#[0-9a-f]{6}$/i.test(String(value || ""))
                ? String(value).toUpperCase() : fallback;
            const rgba = (hex, opacity) => {
                const color = safeColor(hex, "#000000");
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                return `rgba(${r},${g},${b},${clamp(opacity, 0, 1)})`;
            };
            const fontFallback = 'Tahoma, "Segoe UI", Arial, "Segoe UI Emoji", sans-serif';
            const fontFamilies = {
                outfit: `"Outfit", ${fontFallback}`,
                sans: fontFallback,
                arial: fontFallback,
                condensed: `"Arial Narrow", Impact, ${fontFallback}`,
                georgia: `Georgia, "Times New Roman", ${fontFallback}`,
                serif: `Georgia, "Times New Roman", ${fontFallback}`,
                impact: `Impact, "Arial Black", ${fontFallback}`,
                mono: `Consolas, "Courier New", monospace, ${fontFallback}`,
                monospace: `Consolas, "Courier New", monospace, ${fontFallback}`,
                abril_fatface: `"Abril Fatface", ${fontFallback}`,
                alfa_slab_one: `"Alfa Slab One", ${fontFallback}`,
                anton: `"Anton", ${fontFallback}`,
                archivo_black: `"Archivo Black", ${fontFallback}`,
                audiowide: `"Audiowide", ${fontFallback}`,
                bangers: `"Bangers", ${fontFallback}`,
                barlow_condensed: `"Barlow Condensed", ${fontFallback}`,
                bebas_neue: `"Bebas Neue", ${fontFallback}`,
                black_ops_one: `"Black Ops One", ${fontFallback}`,
                bungee: `"Bungee", ${fontFallback}`,
                cinzel: `"Cinzel", ${fontFallback}`,
                cinzel_decorative: `"Cinzel Decorative", ${fontFallback}`,
                comfortaa: `"Comfortaa", ${fontFallback}`,
                dancing_script: `"Dancing Script", ${fontFallback}`,
                exo_2: `"Exo 2", ${fontFallback}`,
                fjalla_one: `"Fjalla One", ${fontFallback}`,
                kanit: `"Kanit", ${fontFallback}`,
                lobster: `"Lobster", ${fontFallback}`,
                michroma: `"Michroma", ${fontFallback}`,
                monoton: `"Monoton", ${fontFallback}`,
                montserrat: `"Montserrat", ${fontFallback}`,
                orbitron: `"Orbitron", ${fontFallback}`,
                oswald: `"Oswald", ${fontFallback}`,
                pacifico: `"Pacifico", ${fontFallback}`,
                permanent_marker: `"Permanent Marker", ${fontFallback}`,
                playfair_display: `"Playfair Display", ${fontFallback}`,
                press_start_2p: `"Press Start 2P", ${fontFallback}`,
                rajdhani: `"Rajdhani", ${fontFallback}`,
                righteous: `"Righteous", ${fontFallback}`,
                russo_one: `"Russo One", ${fontFallback}`,
                sacramento: `"Sacramento", ${fontFallback}`,
                saira_condensed: `"Saira Condensed", ${fontFallback}`,
                staatliches: `"Staatliches", ${fontFallback}`,
                teko: `"Teko", ${fontFallback}`,
                unica_one: `"Unica One", ${fontFallback}`,
            };
            const alignments = { left: "flex-start", center: "center", right: "flex-end" };

            function fitContent() {
                // Fit the complete authored value once. Typewriter then reveals
                // that same layout without changing size as characters appear.
                text.textContent = state.content;
                let fontSize = 84;
                text.style.fontSize = `${fontSize}px`;
                const availableHeight = Math.max(32, surface.clientHeight - 20);
                while (fontSize > 26 && text.scrollHeight > availableHeight) {
                    fontSize -= 2;
                    text.style.fontSize = `${fontSize}px`;
                }
            }

            function refitAfterFontLoad(generation) {
                if (generation !== state.fontGeneration || !state.visible || !state.definition) return;
                const renderedContent = text.textContent;
                const animation = state.definition.animation || {};
                const preset = String(animation.type || animation.preset || "none");
                fitContent();
                // A late font load must not reveal the complete line for a frame
                // while the typewriter animation is still in progress.
                if (preset === "typewriter" && renderedContent !== state.content) {
                    text.textContent = renderedContent;
                }
            }

            function loadAndFitFont(fontFamily, weight, generation) {
                if (!document.fonts || typeof document.fonts.load !== "function") return Promise.resolve();
                const fontSpec = `${weight} 84px ${fontFamily}`;
                return Promise.resolve(document.fonts.load(fontSpec, state.content || "Aa"))
                    .then(() => document.fonts.ready)
                    .then(() => refitAfterFontLoad(generation))
                    .catch(() => {
                        // The fallback chain is intentionally complete, so a bad
                        // optional face never prevents the authored text rendering.
                    });
            }

            function setDefinition(definition) {
                if (!definition || typeof definition !== "object") return;
                state.definition = definition;
                state.duration = Math.max(0.1, Number(definition.duration) || 1);
                const style = definition.style || {};
                const alignment = ["left", "center", "right"].includes(style.alignment)
                    ? style.alignment : "center";
                const fontId = String(style.font || "outfit").trim().toLowerCase().replace(/[\s-]+/g, "_");
                const fontFamily = fontFamilies[fontId] || fontFamilies.outfit;
                const fontWeight = style.bold === false ? "500" : "700";
                const fontGeneration = ++state.fontGeneration;
                text.style.fontFamily = fontFamily;
                text.style.fontWeight = fontWeight;
                text.style.color = safeColor(style.color, "#FFFFFF");
                text.style.textAlign = alignment;
                surface.style.justifyContent = alignments[alignment];

                const outline = style.outline || {};
                const outlineSize = outline.enabled === false ? 0 : clamp(outline.width ?? outline.size, 0, 12);
                text.style.webkitTextStroke = outlineSize > 0
                    ? `${outlineSize}px ${rgba(outline.color, outline.opacity == null ? 1 : outline.opacity)}`
                    : "0 transparent";
                const shadows = [];
                const shadow = style.shadow || {};
                if (shadow.enabled !== false) {
                    shadows.push(`${clamp(shadow.offsetX ?? shadow.x, -30, 30)}px `
                        + `${clamp(shadow.offsetY ?? shadow.y, -30, 30)}px `
                        + `${clamp(shadow.blur ?? shadow.size, 0, 40)}px `
                        + `${rgba(shadow.color, shadow.opacity == null ? 0.65 : shadow.opacity)}`);
                }
                const glow = style.glow || {};
                const glowStrength = clamp(glow.strength, 0, 1);
                const glowSize = glow.size == null ? glowStrength * 40 : clamp(glow.size, 0, 40);
                const glowOpacity = glow.opacity == null ? glowStrength : clamp(glow.opacity, 0, 1);
                if (glow.enabled !== false && glowSize > 0 && glowOpacity > 0) {
                    const glowColor = rgba(glow.color, glowOpacity);
                    shadows.push(`0 0 ${glowSize}px ${glowColor}`);
                    shadows.push(`0 0 ${glowSize * 0.5}px ${glowColor}`);
                }
                text.style.textShadow = shadows.length ? shadows.join(",") : "none";

                const content = typeof definition.text === "string"
                    ? definition.text : typeof definition.content === "string" ? definition.content : "";
                const characters = typeof Intl !== "undefined" && typeof Intl.Segmenter === "function"
                    ? Array.from(new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(content),
                        (part) => part.segment)
                    : Array.from(content);
                // Keep normal text in one node so Arabic/Indic shaping, RTL and
                // combining marks remain intact. Animated reveals join complete
                // grapheme segments instead of exposing UTF-8/code-unit slices.
                state.content = content;
                state.segments = characters;
                fitContent();
                state.visible = true;
                surface.setAttribute("aria-hidden", "false");
                return loadAndFitFont(fontFamily, fontWeight, fontGeneration);
            }

            function phaseFor(time, animation, duration) {
                const inDuration = clamp(animation.inDuration ?? animation.in, 0, Math.min(30, duration));
                const outDuration = clamp(animation.outDuration ?? animation.out, 0, Math.min(30, duration));
                const inPhase = inDuration > 0 ? clamp(time / inDuration, 0, 1) : 1;
                const outPhase = outDuration > 0
                    ? clamp((duration - time) / outDuration, 0, 1) : 1;
                return { inPhase, outPhase, visibility: Math.min(inPhase, outPhase) };
            }

            function sampleMotion(points, time) {
                if (!Array.isArray(points) || !points.length) return null;
                let left = points[0], right = null;
                for (const point of points) {
                    if (point.time <= time) left = point;
                    else { right = point; break; }
                }
                let amount = right && time >= left.time ? clamp((time-left.time) / Math.max(.000001,right.time-left.time),0,1) : 0;
                if (left.easing === "hold") amount = 0;
                else if (left.easing === "smooth") amount = amount*amount*(3-2*amount);
                right = right || left;
                return {opacity:left.opacity+(right.opacity-left.opacity)*amount,
                    blur:left.blur+(right.blur-left.blur)*amount};
            }

            function render(time) {
                const definition = state.definition;
                if (!state.visible || !definition) {
                    surface.style.opacity = "0";
                    return;
                }
                const style = definition.style || {};
                const animation = definition.animation || {};
                const preset = String(animation.type || animation.preset || "none");
                const motion = sampleMotion(animation.keyframes, time);
                const phase = phaseFor(time, animation, state.duration);
                // A keyed envelope owns visibility. Basic motion can continue underneath.
                if (motion) { phase.visibility = 1; phase.outPhase = 1; }
                let opacity = clamp(style.opacity == null ? 1 : style.opacity, 0, 1);
                let transform = "translate3d(0,0,0) scale(1)";

                if (preset === "fade_slide") {
                    opacity *= phase.visibility;
                    const y = (1 - phase.inPhase) * 24 - (1 - phase.outPhase) * 14;
                    transform = `translate3d(0,${y}px,0) scale(1)`;
                } else if (preset === "scale") {
                    opacity *= phase.visibility;
                    transform = `translate3d(0,0,0) scale(${0.72 + phase.visibility * 0.28})`;
                } else if (preset === "rise") {
                    opacity *= phase.visibility;
                    const y = (1 - phase.inPhase) * 42 - (1 - phase.outPhase) * 24;
                    transform = `translate3d(0,${y}px,0) scale(1)`;
                } else if (preset === "typewriter") {
                    opacity *= phase.outPhase;
                    const reveal = Math.floor(state.segments.length * phase.inPhase + 0.0001);
                    const visibleText = state.segments.slice(0, reveal).join("");
                    if (text.textContent !== visibleText) text.textContent = visibleText;
                } else if (preset === "wave") {
                    opacity *= phase.visibility;
                    transform = `translate3d(0,${Math.sin(time * 7) * 9}px,0) rotate(${Math.sin(time * 4) * 0.8}deg)`;
                }

                if (preset !== "typewriter" && text.textContent !== state.content) text.textContent = state.content;
                if (motion) opacity *= motion.opacity;
                text.style.filter = motion && motion.blur > 0 ? `blur(${motion.blur}px)` : "none";
                surface.style.opacity = String(opacity);
                text.style.transform = transform;
            }

            window.addEventListener("message", (event) => {
                const message = event.data;
                if (!message || typeof message !== "object") return;
                if (message.type === "cinematicText:set") {
                    Promise.resolve(setDefinition(message.definition)).then(() => acknowledge(message.revision));
                } else if (message.type === "cinematicText:frame") {
                    state.sampleTime = clamp(message.time, 0, Number(message.duration) || state.duration);
                    state.duration = Math.max(0.1, Number(message.duration) || state.duration);
                    state.paused = message.paused === true;
                    state.sampleAt = performance.now();
                } else if (message.type === "cinematicText:hide") {
                    state.fontGeneration++;
                    state.visible = false;
                    surface.setAttribute("aria-hidden", "true");
                    surface.style.opacity = "0";
                }
            });

            // Announce readiness only after the DUI message listener exists.
            void acknowledge(0);

            window.addEventListener("resize", () => {
                if (state.visible) refitAfterFontLoad(state.fontGeneration);
            });

            function frame(now) {
                const interpolated = state.paused
                    ? state.sampleTime
                    : Math.min(state.duration, state.sampleTime + Math.max(0, now - state.sampleAt) / 1000);
                render(interpolated);
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>

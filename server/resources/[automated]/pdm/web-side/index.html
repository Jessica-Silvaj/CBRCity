<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./script.js"></script>
    <link rel="stylesheet" crossorigin href="./style.css">
</head>

<body>
    <div id="app"></div>
    <script>
        window.addEventListener("message", function (event) {
            if (event.data.Action === "Open") {
                let style = document.getElementById("dynamic-logo-style");
                if (event.data.Payload && event.data.Payload.Logo && event.data.Payload.Logo !== "") {
                    if (!style) {
                        style = document.createElement("style");
                        style.id = "dynamic-logo-style";
                        document.head.appendChild(style);
                    }
                    style.innerHTML = `
                        img[src*="logo.png"] {
                            content: url("images/${event.data.Payload.Logo}") !important;
                        }
                    `;
                } else {
                    if (style) style.innerHTML = "";
                }
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"> -->
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script>
        window.NationConfig = window.NationConfig || {};
        try {
            $.post("https://" + GetParentResourceName() + "/getNationConfig", JSON.stringify({}), function(cfg) {
                if (cfg) {
                    window.NationConfig = cfg;
                    if (typeof imgDir !== "undefined" && cfg.ScriptNationBarbershop) {
                        imgDir = cfg.ScriptNationBarbershop;
                    }
                }
            });
        } catch(e) {}
        window.addEventListener("message", function(event) {
            if (event.data && event.data.action === "setNationConfig" && event.data.NationConfig) {
                window.NationConfig = event.data.NationConfig;
                if (typeof imgDir !== "undefined" && window.NationConfig.ScriptNationBarbershop) {
                    imgDir = window.NationConfig.ScriptNationBarbershop;
                }
            }
        });
    </script>    <script src="config.js"></script>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
    <title>Nation Barbershop</title>
</head>

<body>
    <div class="barbershop">
        <div class="cam"></div>
        <div class="container"></div>
        <div class="container2"></div>
    </div>
    <div class="popup-container"></div>

    <script src="script.js"></script>
</body>

</html>

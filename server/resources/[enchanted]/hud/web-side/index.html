<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./script.js"></script>
    <link rel="stylesheet" crossorigin href="./style.css">
</head>

<body>
    <div id="app"></div>

    <!-- Indicador de sangramento (fora do script.js protegido). Estado vem do paramedic via hud:Bleeding -->
    <div id="bleeding" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5c-3.6 4.6-6.5 8.4-6.5 12A6.5 6.5 0 0 0 18.5 14.5C18.5 10.9 15.6 7.1 12 2.5z"/></svg>
        <div class="bleeding-info">
            <span class="bleeding-title">Sangramento</span>
        </div>
    </div>
    <style>
        #bleeding {
            position: fixed; left: 50%; bottom: 3.2vh; transform: translateX(-50%);
            display: none; align-items: center; gap: 0.55rem;
            padding: 0.45rem 0.8rem 0.45rem 0.6rem; border-radius: 0.5rem;
            background: rgba(13, 13, 13, 0.78); border: 1px solid rgba(220, 38, 38, 0.45);
            font-family: "Rajdhani", sans-serif; color: #fff; pointer-events: none; z-index: 50;
        }
        #bleeding.show { display: flex; }
        #bleeding svg { width: 1.35rem; height: 1.35rem; fill: #dc2626; filter: drop-shadow(0 0 4px rgba(220, 38, 38, 0.8)); }
        #bleeding.show svg { animation: bleeding-pulse 1s ease-in-out infinite; }
        .bleeding-info { display: flex; flex-direction: column; line-height: 1; }
        .bleeding-title { font-size: 1rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); }
        @keyframes bleeding-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: 0.7; } }
    </style>
    <script>
        (function () {
            var box = document.getElementById("bleeding");
            var visible = false, bleeding = false;

            function render() {
                box.classList.toggle("show", visible && bleeding);
            }

            window.addEventListener("message", function (event) {
                var data = event.data || {};
                if (data.Action === "Body") { visible = !!data.Payload; render(); }
                else if (data.Action === "Bleeding") { bleeding = Number(data.Payload) > 0; render(); }
            });
        })();
    </script>

    <!-- Círculo do pulmão (Night_Vape), fora do script.js protegido. Estado vem via hud:Lung.
         Mede os círculos de status da HUD e se posiciona à direita do último, no mesmo tamanho. -->
    <div id="lung" aria-hidden="true">
        <svg class="lung-ring" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="15.5" class="lung-track"/>
            <circle cx="18" cy="18" r="15.5" class="lung-fill" id="lung-fill"/>
        </svg>
        <span class="lung-disc"></span>
        <svg class="lung-icon" viewBox="0 0 24 24"><path d="M11 3h2v7.2l2.3 1.5c.4-1.8 1.4-4.4 3.2-5.6 1.7-1.1 3.5.3 3.5 2.4V17c0 2.2-1.8 4-4 4-1.9 0-3.6-1.3-3.9-3.2l-.5-3.6L12 12.8l-1.6 1.4-.5 3.6C9.6 19.7 7.9 21 6 21c-2.2 0-4-1.8-4-4V8.5c0-2.1 1.8-3.5 3.5-2.4 1.8 1.2 2.8 3.8 3.2 5.6L11 10.2V3z"/></svg>
        <span class="lung-text" id="lung-text">0%</span>
    </div>
    <style>
        #lung {
            position: fixed; display: none; pointer-events: none; z-index: 50;
            font-family: "Rajdhani", sans-serif; color: #fff;
        }
        #lung.show { display: block; }
        #lung .lung-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        /* mesmo padrão dos círculos de vida/colete/fome/sede: anel colorido, disco colorido por dentro e ícone branco */
        #lung { --lung: #f472b6; }
        #lung .lung-track { fill: rgba(13, 13, 13, 0.55); stroke: rgba(255, 255, 255, 0.15); stroke-width: 2; }
        #lung .lung-fill { fill: none; stroke: var(--lung); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 97.4; stroke-dashoffset: 97.4; transition: stroke-dashoffset 0.3s; }
        #lung .lung-disc { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); border-radius: 50%; background: var(--lung); }
        #lung .lung-icon { position: absolute; left: 50%; top: 50%; width: 24%; height: 24%; transform: translate(-50%, -50%); fill: #fff; }
        #lung .lung-text { position: absolute; left: 50%; top: calc(100% + 0.35rem); transform: translateX(-50%); font-weight: 700; font-size: 0.8rem; white-space: nowrap; }
        #lung.danger { --lung: #ef4444; }
        #lung.danger .lung-icon { animation: lung-pulse 0.8s ease-in-out infinite; }
        @keyframes lung-pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } }
    </style>
    <script>
        (function () {
            var box = document.getElementById("lung");
            var fill = document.getElementById("lung-fill");
            var text = document.getElementById("lung-text");
            var visible = true, level = 0;

            // acha a fileira de círculos de status (vida, colete, fome, sede), no canto inferior direito, e devolve o primeiro e o passo entre eles
            function anchor() {
                var rings = Array.prototype.map.call(document.querySelectorAll("#app svg"), function (svg) {
                    return svg.getBoundingClientRect();
                }).filter(function (r) {
                    return r.width >= 20 && Math.abs(r.width - r.height) <= 4 && r.left > window.innerWidth / 2 && r.top > window.innerHeight / 2;
                });

                var rows = {};
                rings.forEach(function (r) {
                    var key = Math.round(r.top / 6);
                    (rows[key] = rows[key] || []).push(r);
                });

                var best = null;
                Object.keys(rows).forEach(function (k) {
                    if (!best || rows[k].length > best.length) best = rows[k];
                });
                if (!best || best.length < 2) return null;

                best.sort(function (a, b) { return a.left - b.left; });
                return { first: best[0], step: best[1].left - best[0].left };
            }

            // texto "NN%" logo abaixo do círculo informado
            function percentLabel(ring) {
                var found = null;
                Array.prototype.forEach.call(document.querySelectorAll("#app *"), function (el) {
                    if (found || el.children.length || !/^\d+%$/.test((el.textContent || "").trim())) return;
                    var r = el.getBoundingClientRect();
                    if (r.top >= ring.bottom - 2 && r.top <= ring.bottom + 40 && Math.abs((r.left + r.width / 2) - (ring.left + ring.width / 2)) < ring.width) found = el;
                });
                return found;
            }

            function render() {
                var show = visible && level > 0;
                box.classList.toggle("show", show);
                if (!show) return;

                // à esquerda da vida, na mesma fileira; se não achar, fica fixo no canto inferior direito
                var pos = anchor();
                if (pos) {
                    box.style.left = (pos.first.left - pos.step) + "px";
                    box.style.top = pos.first.top + "px";
                    box.style.width = pos.first.width + "px";
                    box.style.height = pos.first.height + "px";
                } else {
                    box.style.left = "calc(100vw - 17rem)";
                    box.style.top = "calc(100vh - 5.5rem)";
                    box.style.width = "2.8rem";
                    box.style.height = "2.8rem";
                }

                // texto da porcentagem igual ao dos outros círculos (copia fonte, tamanho e distância do "100%" da vida)
                var label = pos && percentLabel(pos.first);
                if (label) {
                    var css = getComputedStyle(label);
                    var rect = label.getBoundingClientRect();
                    text.style.fontFamily = css.fontFamily;
                    text.style.fontSize = css.fontSize;
                    text.style.fontWeight = css.fontWeight;
                    text.style.color = css.color;
                    text.style.top = (rect.top - pos.first.top) + "px";
                }

                // vermelho quando o pulmão está cheio (próxima puxada dá tosse)
                box.classList.toggle("danger", level >= 100);
                fill.style.strokeDashoffset = 97.4 * (1 - level / 100);
                text.textContent = Math.round(level) + "%";
            }

            window.addEventListener("message", function (event) {
                var data = event.data || {};
                if (data.Action === "Body") { visible = !!data.Payload; render(); }
                else if (data.Action === "Lung") { level = Math.max(0, Math.min(100, Number(data.Payload) || 0)); render(); }
            });

            window.addEventListener("resize", render);
        })();
    </script>
</body>

</html>

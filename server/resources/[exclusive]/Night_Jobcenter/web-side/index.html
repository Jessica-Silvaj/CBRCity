<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com/3.3.5"></script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'app-bg': '#0a0a0a',
                        'app-surface': '#121212',
                        'app-border': '#262626',
                        'app-primary': '#2e8b57',
                        'app-primary-hover': '#8fd1ac',
                    }
                }
            }
        }
    </script>
    <script src="script.js" defer></script>
    <title>Creative Network</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="flex items-center justify-center h-screen w-screen overflow-hidden" style="display: none;">

    <div id="appContainer"
        class="w-[76rem] h-[46rem] bg-app-bg border border-app-border rounded-xl shadow-[0_0_80px_rgba(0,0,0,0.8)] flex overflow-hidden">

        <!-- Sidebar -->
        <div class="w-[22rem] bg-app-surface border-r border-app-border flex flex-col z-10 shrink-0">
            <div class="p-6 pb-5 border-b border-app-border">
                <h1 class="text-xl font-extrabold text-white tracking-wide uppercase flex items-center gap-3 whitespace-nowrap">
                    <i class="fa-solid fa-city text-app-primary"></i>
                    Central de Empregos
                </h1>
                <p class="text-[11px] text-gray-500 mt-1.5 font-bold uppercase tracking-widest">Carreiras Disponíveis
                </p>
            </div>
            <div id="jobList" class="flex-1 overflow-y-auto p-4 space-y-1">
                <!-- Itens gerados dinamicamente via script.js -->
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="jobDetails" class="flex-1 flex flex-col bg-app-bg overflow-y-auto relative">
            <!-- Detalhes preenchidos no script.js -->
            <div class="flex-1 flex flex-col items-center justify-center text-gray-600 gap-4">
                <i class="fa-solid fa-briefcase text-4xl opacity-50"></i>
                <p class="font-medium">Selecione um emprego na lista ao lado.</p>
            </div>
        </div>

    </div>

</body>

</html>

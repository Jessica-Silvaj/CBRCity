<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: transparent;
			font-family: "Segoe UI", Arial, sans-serif;
			color: #f2f2f2;
			user-select: none;
		}

		.tecla {
			display: inline-block;
			min-width: 20px;
			padding: 1px 6px;
			margin-right: 5px;
			border-radius: 4px;
			background: rgba(255, 255, 255, 0.12);
			border: 1px solid rgba(255, 255, 255, 0.2);
			text-align: center;
			font-weight: 700;
			color: #fff;
		}

		.barra { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
		.barra div { height: 100%; width: 0; border-radius: 4px; background: rgb(var(--cor)); transition: width 0.3s, background 0.4s; }

		@keyframes pisca { 50% { opacity: 0.45; } }

		/* ---------- PAINEL DO VAPE NA MÃO ---------- */
		#vape {
			--cor: 46, 139, 87;
			position: absolute;
			right: 2vw;
			bottom: 22vh;
			width: 260px;
			padding: 14px 16px;
			border-radius: 12px;
			background: rgba(14, 16, 18, 0.82);
			border: 1px solid rgba(var(--cor), 0.45);
			box-shadow: 0 0 18px rgba(var(--cor), 0.18);
			opacity: 0;
			transform: translateX(20px);
			transition: opacity 0.25s, transform 0.25s, border-color 0.4s, box-shadow 0.4s;
		}

		#vape.aberto { opacity: 1; transform: translateX(0); }

		.topo { display: flex; justify-content: space-between; align-items: baseline; }
		.nome { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #9aa0a6; }
		.ml { font-size: 12px; color: #9aa0a6; font-variant-numeric: tabular-nums; }

		.sabor { display: flex; align-items: center; gap: 8px; margin: 8px 0 10px; font-size: 17px; font-weight: 600; }
		.bolinha {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: rgb(var(--cor));
			box-shadow: 0 0 8px rgb(var(--cor));
			transition: background 0.4s, box-shadow 0.4s;
		}

		#tanque.baixo { animation: pisca 1s infinite; }

		#carga { margin-top: 6px; height: 4px; opacity: 0; transition: opacity 0.2s; }
		#carga.ativa { opacity: 1; }
		#carga div { background: #f2f2f2; transition: none; }

		#pulmao { margin-top: 10px; }
		#pulmao .linha { display: flex; justify-content: space-between; font-size: 12px; color: #9aa0a6; margin-bottom: 4px; }
		#pulmao .barra { height: 5px; }
		#pulmao-barra { transition: width 0.3s, background 0.3s !important; }
		#pulmao.cheio #pulmao-texto { color: #ff5a5a; font-weight: 700; animation: pisca 0.8s infinite; }
		#pulmao.irritado #pulmao-texto { color: #e8b04a; font-weight: 700; }

		#efeito {
			display: none;
			margin-top: 10px;
			padding: 8px 10px;
			border-radius: 8px;
			background: rgba(var(--cor), 0.14);
			border: 1px solid rgba(var(--cor), 0.35);
		}
		#efeito.ativo { display: block; }
		#efeito .linha { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
		#efeito .desc { font-size: 11px; color: #c9cdd1; margin: 2px 0 6px; }
		#efeito .barra { height: 3px; }
		#efeito .barra div { transition: width 0.1s linear; }

		.teclas { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: #c9cdd1; }
		.teclas .esperando { opacity: 0.4; }

		/* ---------- ESTAÇÃO DE RECARGA ---------- */
		#recarga {
			--tanque: 120, 120, 120;
			--frasco: 46, 139, 87;
			position: absolute;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.7));
		}
		#recarga.aberto { display: flex; }

		.janela {
			width: 1040px;
			max-width: 96vw;
			padding: 20px 22px;
			border-radius: 18px;
			background: rgba(13, 15, 17, 0.96);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
		}

		.cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
		.cabecalho h1 { font-size: 20px; font-weight: 700; }
		.cabecalho h1 small { font-size: 12px; font-weight: 600; color: #9aa0a6; margin-left: 10px; letter-spacing: 1px; text-transform: uppercase; }
		.fechar { background: none; border: none; color: #9aa0a6; font-size: 13px; cursor: pointer; }
		.fechar:hover { color: #fff; }

		.estacao { display: grid; grid-template-columns: 230px 1fr 270px; gap: 18px; height: 430px; }
		.coluna h2 { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #7d8389; margin-bottom: 10px; }
		.rolagem { overflow-y: auto; max-height: 396px; padding-right: 4px; }
		.rolagem::-webkit-scrollbar { width: 4px; }
		.rolagem::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 2px; }

		/* vapes da mochila */
		.vape-card {
			--c: 120, 120, 120;
			padding: 10px 12px;
			margin-bottom: 8px;
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 255, 255, 0.07);
			cursor: pointer;
			transition: border-color 0.2s, background 0.2s;
		}
		.vape-card:hover { background: rgba(255, 255, 255, 0.07); }
		.vape-card.escolhido { border-color: rgba(var(--c), 0.9); background: rgba(var(--c), 0.12); }
		.vape-card .linha { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
		.vape-card .linha span:last-child { color: #9aa0a6; font-weight: 600; font-variant-numeric: tabular-nums; }
		.vape-card .info { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9aa0a6; margin: 4px 0 7px; }
		.vape-card .info i { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--c)); }
		.vape-card .barra { height: 5px; }
		.vape-card .barra div { background: rgb(var(--c)); }
		.vape-card .gasto { font-size: 10px; color: #6f757b; margin-top: 6px; }

		/* palco com o vape em 3D */
		.palco {
			position: relative;
			border-radius: 14px;
			background: radial-gradient(circle at 50% 60%, rgba(var(--tanque), 0.16), rgba(255, 255, 255, 0.02) 60%);
			border: 1px solid rgba(255, 255, 255, 0.05);
			perspective: 900px;
			overflow: hidden;
			cursor: grab;
		}
		.palco.arrastando { cursor: grabbing; }
		.chao { position: absolute; left: 50%; bottom: 42px; width: 150px; height: 26px; margin-left: -75px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55), transparent 70%); }

		.giro { position: absolute; left: 50%; top: 40px; width: 92px; height: 330px; margin-left: -46px; transform-style: preserve-3d; transition: transform 0.08s linear; }
		.giro.balanco { animation: balanco 6s ease-in-out infinite; }
		@keyframes balanco { 0%, 100% { transform: rotateY(-22deg) rotateX(6deg); } 50% { transform: rotateY(22deg) rotateX(6deg); } }

		/* corpo: várias fatias giradas formam um cilindro */
		.fatia { position: absolute; left: 50%; width: 30px; margin-left: -15px; backface-visibility: hidden; }
		.bocal { top: 0; height: 58px; transition: transform 0.45s cubic-bezier(.3,1.4,.5,1); cursor: pointer; }
		.giro.aberto .bocal { transform: translateY(-46px) translateZ(var(--z)) rotateY(var(--r)) rotateZ(-18deg) !important; }
		.bocal div { width: 100%; height: 100%; border-radius: 14px 14px 4px 4px; }
		.vidro { top: 60px; height: 120px; }
		.vidro div { position: relative; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.07); border-left: 1px solid rgba(255, 255, 255, 0.18); border-right: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; }
		.vidro div b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(rgba(var(--tanque), 0.75), rgba(var(--tanque), 1)); box-shadow: 0 0 14px rgba(var(--tanque), 0.7); transition: height 0.9s ease, background 0.5s; }
		.vidro div b.previa { background: repeating-linear-gradient(45deg, rgba(var(--frasco), 0.55) 0 5px, rgba(var(--frasco), 0.25) 5px 10px); box-shadow: none; transition: height 0.4s; }
		.corpo { top: 182px; height: 148px; }
		.corpo div { width: 100%; height: 100%; border-radius: 3px 3px 16px 16px; }

		/* acabamento de cada modelo */
		.classic .bocal div { background: linear-gradient(90deg, #1c1e21, #3a3d42 50%, #1c1e21); }
		.classic .corpo div { background: linear-gradient(90deg, #6d7278, #c8ccd1 45%, #7b8086); }
		.pro .bocal div { background: linear-gradient(90deg, #8a6a24, #e6c46c 50%, #8a6a24); }
		.pro .corpo div { background: linear-gradient(90deg, #0b0b0c, #34363a 45%, #0b0b0c); }
		.volt .bocal div { background: linear-gradient(90deg, #0b2a4a, #2f8de4 50%, #0b2a4a); }
		.volt .corpo div { background: linear-gradient(90deg, #0b1220, #22324a 45%, #0b1220); box-shadow: inset 0 -30px 30px -20px rgba(47, 141, 228, 0.6); }

		.dica { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 12px; color: #9aa0a6; pointer-events: none; }
		.dica b { color: #fff; }
		.medidor { position: absolute; top: 14px; left: 16px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
		.medidor small { display: block; font-size: 11px; font-weight: 600; color: #9aa0a6; }

		/* frasco escolhido + jato despejando */
		.frasco-grande {
			position: absolute;
			right: 26px;
			top: 70px;
			width: 70px;
			height: 120px;
			cursor: pointer;
			transform-origin: 50% 20%;
			transition: transform 0.5s ease;
		}
		.frasco-grande.oculto { opacity: 0; pointer-events: none; }
		.frasco-grande .tampa { width: 22px; height: 18px; margin: 0 auto; border-radius: 4px 4px 0 0; background: #1b1d20; }
		.frasco-grande .gargalo { width: 30px; height: 10px; margin: 0 auto; background: #2a2d31; }
		.frasco-grande .vidro-f { position: relative; height: 92px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); overflow: hidden; }
		.frasco-grande .vidro-f b { position: absolute; left: 0; right: 0; bottom: 0; background: rgb(var(--frasco)); transition: height 0.9s ease; }
		.frasco-grande:hover { transform: rotate(-6deg); }
		.frasco-grande.despejando { transform: translate(-128px, -36px) rotate(-118deg); }
		.jato { position: absolute; left: 50%; top: 18px; width: 5px; height: 0; margin-left: -2px; border-radius: 3px; background: rgb(var(--frasco)); box-shadow: 0 0 10px rgba(var(--frasco), 0.8); opacity: 0; transition: height 0.35s ease, opacity 0.2s; }
		.jato.ativo { height: 52px; opacity: 1; }

		/* frascos da mochila */
		.liquidos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
		.card {
			--c: 46, 139, 87;
			position: relative;
			padding: 8px;
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 255, 255, 0.07);
			cursor: pointer;
			transition: border-color 0.2s, background 0.2s;
		}
		.card:hover { background: rgba(var(--c), 0.1); border-color: rgba(var(--c), 0.5); }
		.card.escolhido { background: rgba(var(--c), 0.18); border-color: rgb(var(--c)); }
		.card.vazio { opacity: 0.3; cursor: default; pointer-events: none; }
		.card img { display: block; width: 40px; height: 40px; margin: 0 auto 4px; }
		.card .titulo { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; }
		.card .titulo span { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--c)); }
		.card .ef { font-size: 10px; font-weight: 700; color: rgb(var(--c)); margin-top: 2px; }
		.card .qtd { position: absolute; top: 6px; right: 8px; font-size: 11px; font-weight: 700; color: #c9cdd1; }
		.card .aberto-ml { font-size: 10px; color: #9aa0a6; }

		.rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 16px; min-height: 38px; }
		#aviso { font-size: 12px; color: #e8b04a; }
		#acao {
			padding: 10px 22px;
			border: none;
			border-radius: 8px;
			background: rgb(var(--frasco));
			color: #0e1012;
			font-size: 14px;
			font-weight: 800;
			cursor: pointer;
			transition: filter 0.2s, opacity 0.2s;
		}
		#acao:hover { filter: brightness(1.15); }
		#acao:disabled { opacity: 0.35; cursor: default; filter: none; }
	</style>
</head>
<body>
	<div id="vape">
		<div class="topo">
			<span class="nome" id="nome">Vape</span>
			<span class="ml" id="ml">0.0 / 5 ml</span>
		</div>
		<div class="sabor"><span class="bolinha"></span><span id="sabor">Tanque vazio</span></div>
		<div class="barra" id="tanque"><div id="nivel"></div></div>
		<div id="efeito">
			<div class="linha"><span id="efeito-nome"></span><span id="efeito-tempo"></span></div>
			<div class="barra"><div id="efeito-barra"></div></div>
		</div>
	</div>


	<div id="recarga">
		<div class="janela">
			<div class="cabecalho">
				<h1>Estação de recarga<small id="modo-mistura"></small></h1>
				<button class="fechar" id="fechar"><span class="tecla">ESC</span>Fechar</button>
			</div>
			<div class="estacao">
				<div class="coluna">
					<h2>Seus vapes</h2>
					<div class="rolagem" id="vapes"></div>
				</div>

				<div class="palco" id="palco">
					<div class="medidor" id="medidor"></div>
					<div class="chao"></div>
					<div class="giro balanco" id="giro"></div>
					<div class="frasco-grande oculto" id="frasco">
						<div class="tampa"></div>
						<div class="gargalo"></div>
						<div class="vidro-f"><b id="frasco-nivel"></b></div>
						<div class="jato" id="jato"></div>
					</div>
					<div class="dica" id="dica"></div>
				</div>

				<div class="coluna">
					<h2>Frascos</h2>
					<div class="rolagem liquidos" id="lista"></div>
				</div>
			</div>
			<div class="rodape">
				<span id="aviso"></span>
				<button id="acao" disabled>Escolha um frasco</button>
			</div>
		</div>
	</div>

	<script>
		const $ = (Id) => document.getElementById(Id);
		const Post = (Name, Data = {}) => fetch(`https://${GetParentResourceName()}/${Name}`, { method: "POST", body: JSON.stringify(Data) });
		const Padrao = [46, 139, 87];
		const Cinza = [120, 120, 120];
		const Fmt = (Ml) => (Math.round(Ml * 10) / 10).toFixed(1);

		// ---------- som da puxada (loop enquanto segura, some devagar ao soltar) ----------
		const Som = { Ctx: null, Buffer: null, Fonte: null, Ganho: null };

		async function CarregarSom() {
			if (Som.Buffer) return Som.Buffer;
			Som.Ctx = Som.Ctx || new AudioContext();
			const Resposta = await fetch("vape-loop.wav");
			Som.Buffer = await Som.Ctx.decodeAudioData(await Resposta.arrayBuffer());
			return Som.Buffer;
		}

		async function TocarPuxada(Volume) {
			try {
				const Buffer = await CarregarSom();
				PararPuxada(0);
				const Agora = Som.Ctx.currentTime;
				Som.Ganho = Som.Ctx.createGain();
				Som.Ganho.gain.setValueAtTime(0, Agora);
				Som.Ganho.gain.linearRampToValueAtTime(Math.max(0, Math.min(1, Volume ?? 0.35)), Agora + 0.15);
				Som.Ganho.connect(Som.Ctx.destination);
				Som.Fonte = Som.Ctx.createBufferSource();
				Som.Fonte.buffer = Buffer;
				Som.Fonte.loop = true;
				Som.Fonte.connect(Som.Ganho);
				Som.Fonte.start();
			} catch (Erro) {}
		}

		function PararPuxada(Fade = 0.3) {
			if (!Som.Fonte) return;
			const Fonte = Som.Fonte, Ganho = Som.Ganho, Agora = Som.Ctx.currentTime;
			Ganho.gain.cancelScheduledValues(Agora);
			Ganho.gain.setValueAtTime(Ganho.gain.value, Agora);
			Ganho.gain.linearRampToValueAtTime(0, Agora + Fade);
			Fonte.stop(Agora + Fade + 0.02);
			Som.Fonte = null;
			Som.Ganho = null;
		}
		// ---------- painel do vape na mão ----------
		function Atualizar(Data) {
			const Cor = Data.Color || Padrao;
			const Fracao = Data.Capacity > 0 ? Math.max(0, Math.min(1, Data.Ml / Data.Capacity)) : 0;

			$("vape").style.setProperty("--cor", Cor.join(", "));
			$("nome").textContent = Data.Name || "Vape";
			$("ml").textContent = `${Data.Ml.toFixed(1)} / ${Data.Capacity.toFixed(0)} ml`;
			$("sabor").textContent = Data.Flavor && Data.Ml > 0 ? Data.Flavor : "Tanque vazio";
			$("nivel").style.width = `${Fracao * 100}%`;
			$("tanque").classList.toggle("baixo", Fracao > 0 && Fracao <= 0.2);

			const Efeito = Data.Effect;
			$("efeito").classList.toggle("ativo", !!Efeito);
			if (Efeito) {
				$("efeito-nome").textContent = Efeito.Label;
				$("efeito-tempo").textContent = `${Efeito.Seconds}s`;
				$("efeito-barra").style.width = `${Math.max(0, Efeito.Left) * 100}%`;
			}
		}


		// ---------- estação de recarga ----------
		let Estacao = null;      // dados vindos do servidor
		let VapeSel = null;      // item do vape escolhido
		let FrascoSel = null;    // item do líquido escolhido
		let Aberto = false;      // bocal aberto
		let Despejando = false;

		const Lados = 8;
		const Raio = 15 / Math.tan(Math.PI / Lados);

		// monta o cilindro: cada parte (bocal, vidro, corpo) é feita de fatias giradas em volta do eixo
		function MontarVape(Style) {
			const Giro = $("giro");
			Giro.className = "giro " + Style + (Arrasto.Ativo || Arrasto.Fixo ? "" : " balanco") + (Aberto ? " aberto" : "");
			Giro.innerHTML = "";

			for (const Parte of ["bocal", "vidro", "corpo"]) {
				for (let i = 0; i < Lados; i++) {
					const Angulo = (360 / Lados) * i;
					const Fatia = document.createElement("div");
					Fatia.className = "fatia " + Parte;
					Fatia.style.setProperty("--r", Angulo + "deg");
					Fatia.style.setProperty("--z", Raio + "px");
					Fatia.style.transform = `rotateY(${Angulo}deg) translateZ(${Raio}px)`;
					Fatia.innerHTML = Parte === "vidro" ? '<div><b class="previa"></b><b class="nivel"></b></div>' : "<div></div>";
					if (Parte === "bocal") Fatia.addEventListener("click", AlternarBocal);
					Giro.appendChild(Fatia);
				}
			}
		}

		function Vape() { return Estacao && Estacao.Vapes.find((V) => V.Item === VapeSel); }
		function Frasco() { return Estacao && Estacao.Liquids.find((L) => L.Item === FrascoSel); }

		// quanto o frasco escolhido tem para despejar (frasco aberto ou um fechado novo)
		function Disponivel(L) {
			if (!L) return 0;
			if (L.Open > 0) return L.Open;
			return L.Amount > 0 ? Estacao.Bottle : 0;
		}

		function Situacao() {
			const V = Vape(), L = Frasco();
			if (!V) return { Pode: false, Aviso: "Você não tem vape na mochila." };
			if (!L) return { Pode: false, Aviso: "" };

			const Espaco = Math.max(0, V.Capacity - V.Ml);
			const Outro = V.Ml > 0 && V.Flavor && V.Flavor !== L.Item;
			if (Outro && !Estacao.AllowMix) return { Pode: false, Aviso: `Esse tanque tem ${V.FlavorName}. Esvazie antes de colocar ${L.Name}.` };
			if (Espaco < 0.01) return { Pode: false, Aviso: "O tanque já está cheio." };

			const Despeja = Math.min(Espaco, Disponivel(L));
			if (Despeja <= 0) return { Pode: false, Aviso: `Você não tem ${L.Name}.` };

			const Sobra = Disponivel(L) - Despeja;
			const Aviso = (Outro ? `Misturando: o tanque passa a ser ${L.Name}. ` : "") + (Sobra > 0.01 ? `Sobram ${Fmt(Sobra)} ml no frasco.` : "");
			return { Pode: true, Despeja, Aviso };
		}

		function Desenhar() {
			if (!Estacao) return;
			const V = Vape(), L = Frasco(), S = Situacao();

			// lista de vapes
			const Vapes = $("vapes");
			Vapes.innerHTML = "";
			for (const Item of Estacao.Vapes) {
				const Card = document.createElement("div");
				Card.className = "vape-card" + (Item.Item === VapeSel ? " escolhido" : "");
				Card.style.setProperty("--c", (Item.Color || Cinza).join(", "));
				Card.innerHTML = `
					<div class="linha"><span>${Item.Name}</span><span>${Fmt(Item.Ml)} / ${Fmt(Item.Capacity)} ml</span></div>
					<div class="info"><i></i>${Item.FlavorName || "Vazio"}</div>
					<div class="barra"><div style="width:${(Item.Ml / Item.Capacity) * 100}%"></div></div>
					<div class="gasto">Gasto ${Item.Consumption.toFixed(1)}x por puxada</div>`;
				Card.addEventListener("click", () => {
					if (Despejando || VapeSel === Item.Item) return;
					VapeSel = Item.Item;
					Aberto = false;
					MontarVape(Item.Style);
					Desenhar();
				});
				Vapes.appendChild(Card);
			}

			// frascos
			const Lista = $("lista");
			Lista.innerHTML = "";
			for (const Item of Estacao.Liquids) {
				const Tem = Item.Amount > 0 || Item.Open > 0;
				const Card = document.createElement("div");
				Card.className = "card" + (Tem ? "" : " vazio") + (Item.Item === FrascoSel ? " escolhido" : "");
				Card.style.setProperty("--c", Item.Color.join(", "));
				Card.innerHTML = `
					<span class="qtd">${Item.Amount > 0 ? "x" + Item.Amount : ""}</span>
					<img src="nui://vrp/config/inventory/${Item.Item}.png" onerror="this.style.visibility='hidden'">
					<div class="titulo"><span></span>${Item.Name}</div>
					<div class="ef">${Item.Effect || ""}</div>
					<div class="aberto-ml">${Item.Open > 0 ? "Aberto: " + Fmt(Item.Open) + " ml" : ""}</div>`;
				Card.addEventListener("click", () => {
					if (Despejando) return;
					FrascoSel = Item.Item;
					Desenhar();
				});
				Lista.appendChild(Card);
			}

			// tanque no palco
			const Recarga = $("recarga");
			Recarga.style.setProperty("--tanque", ((V && V.Color) || Cinza).join(", "));
			Recarga.style.setProperty("--frasco", ((L && L.Color) || Padrao).join(", "));
			const Atual = V ? (V.Ml / V.Capacity) * 100 : 0;
			const Previa = V && S.Pode ? ((V.Ml + S.Despeja) / V.Capacity) * 100 : 0;
			document.querySelectorAll(".vidro b.nivel").forEach((B) => (B.style.height = Atual + "%"));
			document.querySelectorAll(".vidro b.previa").forEach((B) => (B.style.height = (Aberto ? Previa : 0) + "%"));
			$("medidor").innerHTML = V ? `${Fmt(V.Ml)} / ${Fmt(V.Capacity)} ml<small>${V.Name} · ${V.FlavorName || "vazio"}</small>` : "";

			// frasco grande
			$("frasco").classList.toggle("oculto", !L || !Aberto);
			$("frasco-nivel").style.height = L ? (Disponivel(L) / Estacao.Bottle) * 100 + "%" : "0%";

			// passo a passo
			let Dica = "";
			if (!V) Dica = "";
			else if (!Aberto) Dica = "<b>Clique no bocal</b> para abrir o tanque";
			else if (!L) Dica = "Escolha um <b>frasco</b> à direita";
			else if (S.Pode) Dica = "<b>Clique no frasco</b> para despejar";
			$("dica").innerHTML = Despejando ? "Despejando..." : Dica;

			$("aviso").textContent = S.Aviso || "";
			const Acao = $("acao");
			if (!Aberto) { Acao.textContent = "Abrir bocal"; Acao.disabled = !V || Despejando; }
			else { Acao.textContent = L ? `Despejar ${S.Pode ? Fmt(S.Despeja) + " ml de " : ""}${L.Name}` : "Escolha um frasco"; Acao.disabled = !S.Pode || Despejando; }
		}

		function AlternarBocal() {
			if (Despejando || !Vape()) return;
			Aberto = !Aberto;
			$("giro").classList.toggle("aberto", Aberto);
			Desenhar();
		}

		function Despejar() {
			const V = Vape(), L = Frasco(), S = Situacao();
			if (!Aberto || !S.Pode || Despejando) return;

			Despejando = true;
			const Frasco3D = $("frasco");
			Frasco3D.classList.add("despejando");
			setTimeout(() => $("jato").classList.add("ativo"), 450);

			// sobe o líquido no vidro enquanto despeja
			setTimeout(() => {
				const Novo = ((V.Ml + S.Despeja) / V.Capacity) * 100;
				document.querySelectorAll(".vidro b.nivel").forEach((B) => (B.style.background = `rgba(${L.Color.join(", ")}, 1)`, B.style.height = Novo + "%"));
				$("frasco-nivel").style.height = Math.max(0, ((Disponivel(L) - S.Despeja) / Estacao.Bottle) * 100) + "%";
			}, 650);

			setTimeout(() => {
				$("jato").classList.remove("ativo");
				Frasco3D.classList.remove("despejando");
			}, 2000);

			Post("Pour", { Vape: V.Item, Item: L.Item });
			Desenhar();

			// se o servidor não responder (ex.: recusou), destrava
			clearTimeout(Despejar.Trava);
			Despejar.Trava = setTimeout(() => { Despejando = false; Desenhar(); }, 5000);
		}

		// arrastar para girar o vape
		const Arrasto = { Ativo: false, Fixo: false, X: 0, Y: -20, InicioX: 0 };
		$("palco").addEventListener("mousedown", (E) => {
			if (E.target.closest(".bocal") || E.target.closest(".frasco-grande")) return;
			Arrasto.Ativo = true;
			Arrasto.Fixo = true;
			Arrasto.InicioX = E.clientX - Arrasto.X * 2;
			$("giro").classList.remove("balanco");
			$("palco").classList.add("arrastando");
		});
		document.addEventListener("mousemove", (E) => {
			if (!Arrasto.Ativo) return;
			Arrasto.X = (E.clientX - Arrasto.InicioX) / 2;
			$("giro").style.transform = `rotateY(${Arrasto.X}deg) rotateX(6deg)`;
		});
		document.addEventListener("mouseup", () => {
			Arrasto.Ativo = false;
			$("palco").classList.remove("arrastando");
		});

		$("frasco").addEventListener("click", Despejar);
		$("acao").addEventListener("click", () => (Aberto ? Despejar() : AlternarBocal()));

		function AbrirRecarga(Data) {
			Estacao = Data;
			const Primeiro = Data.Vapes.find((V) => V.Item === Data.Selected) || Data.Vapes.find((V) => V.Ml < V.Capacity) || Data.Vapes[0];
			VapeSel = Primeiro ? Primeiro.Item : null;
			FrascoSel = Data.Liquid || null;
			Aberto = false;
			Despejando = false;
			Arrasto.Fixo = false;
			$("giro").style.transform = "";
			$("modo-mistura").textContent = Data.AllowMix ? "Mistura liberada" : "Sem mistura";
			MontarVape(Primeiro ? Primeiro.Style : "classic");
			$("recarga").classList.add("aberto");
			Desenhar();
		}

		// depois de despejar: atualiza tudo sem fechar
		function AtualizarRecarga(Data) {
			Estacao = Data;
			Despejando = false;
			clearTimeout(Despejar.Trava);
			if (!Data.Vapes.find((V) => V.Item === VapeSel)) VapeSel = Data.Vapes[0] ? Data.Vapes[0].Item : null;
			Desenhar();
		}

		function FecharRecarga() {
			$("recarga").classList.remove("aberto");
			Estacao = null;
			VapeSel = null;
			FrascoSel = null;
		}

		$("fechar").addEventListener("click", () => {
			Post("Close");
			FecharRecarga();
		});

		document.addEventListener("keydown", (Event) => {
			if (Event.key === "Escape" && Estacao) {
				Post("Close");
				FecharRecarga();
			}
		});

		window.addEventListener("message", ({ data }) => {
			if (data.Action === "Show") $("vape").classList.add("aberto");
			else if (data.Action === "Hide") $("vape").classList.remove("aberto");
			else if (data.Action === "Update") Atualizar(data);
			else if (data.Action === "OpenRefill") AbrirRecarga(data);
			else if (data.Action === "UpdateRefill") AtualizarRecarga(data);
			else if (data.Action === "CloseRefill") FecharRecarga();
			else if (data.Action === "PuffStart") TocarPuxada(data.Volume);
			else if (data.Action === "PuffStop") PararPuxada();
		});
	</script>
</body>
</html>

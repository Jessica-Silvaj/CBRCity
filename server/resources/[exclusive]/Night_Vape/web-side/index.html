<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--verde: 46, 139, 87;
			--texto: 236, 241, 238;
			--suave: 146, 158, 152;
			--escala: 1;
		}

		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: transparent;
			font-family: "Manrope", "Segoe UI", Arial, sans-serif;
			color: rgb(var(--texto));
			user-select: none;
			-webkit-font-smoothing: antialiased;
		}

		.num { font-family: "Rajdhani", "Manrope", sans-serif; font-variant-numeric: tabular-nums; }

		.barra { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
		.barra i { display: block; height: 100%; width: 0; border-radius: 6px; background: rgb(var(--cor, var(--verde))); transition: width 0.5s ease; }

		/* ---------- CARD DO VAPE NA MÃO (Config.Card) ---------- */
		#vape {
			--cor: var(--verde);
			position: absolute;
			right: 2vw;
			bottom: 22vh;
			width: 250px;
			padding: 14px 16px;
			border-radius: 14px;
			background: linear-gradient(160deg, rgba(17, 26, 21, 0.94), rgba(8, 11, 10, 0.94));
			border: 1px solid rgba(var(--cor), 0.35);
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
			opacity: 0;
			transform: translateX(16px);
			transition: opacity 0.25s, transform 0.25s, border-color 0.4s;
		}
		#vape.aberto { opacity: 1; transform: none; }
		#vape .topo { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: rgb(var(--suave)); }
		#vape .topo .num { font-size: 13px; letter-spacing: 0; }
		#vape .sabor { display: flex; align-items: center; gap: 8px; margin: 8px 0 10px; font-size: 16px; font-weight: 800; }
		#vape .ponto { width: 10px; height: 10px; border-radius: 50%; background: rgb(var(--cor)); box-shadow: 0 0 10px rgb(var(--cor)); }
		#vape .barra i { background: rgb(var(--cor)); }
		#tanque.baixo i { animation: piscar 1s infinite; }
		@keyframes piscar { 50% { opacity: 0.45; } }
		#efeito { display: none; margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(var(--cor), 0.12); border: 1px solid rgba(var(--cor), 0.3); }
		#efeito.ativo { display: block; }
		#efeito .linha { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
		#efeito .barra { height: 3px; }

		/* ---------- ESTAÇÃO DE RECARGA ---------- */
		#recarga {
			--tanque: var(--verde);
			--frasco: var(--verde);
			--acao: var(--verde);
			--acao-texto: #06120b;
			position: absolute;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.8));
		}
		#recarga.aberto { display: flex; }
		#recarga.aberto .janela { animation: entrar 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1); }
		@keyframes entrar {
			from { opacity: 0; transform: scale(calc(var(--escala) * 0.96)) translateY(10px); }
			to { opacity: 1; transform: scale(var(--escala)); }
		}

		.janela {
			position: relative;
			width: 1220px;
			padding: 22px 24px 20px;
			border-radius: 22px;
			background: linear-gradient(165deg, rgba(18, 28, 23, 0.97) 0%, rgba(10, 14, 12, 0.97) 55%, rgba(7, 10, 9, 0.98) 100%);
			border: 1px solid rgba(var(--verde), 0.22);
			box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
			transform: scale(var(--escala));
			overflow: hidden;
		}
		.janela::before {
			content: "";
			position: absolute;
			top: -140px;
			left: -100px;
			width: 460px;
			height: 320px;
			background: radial-gradient(circle, rgba(var(--verde), 0.2), transparent 70%);
			pointer-events: none;
		}

		/* cabeçalho */
		.cabecalho { position: relative; display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
		.marca { display: flex; align-items: center; gap: 14px; }
		.marca-icone {
			width: 46px;
			height: 46px;
			border-radius: 14px;
			display: grid;
			place-items: center;
			background: linear-gradient(145deg, rgba(var(--verde), 0.4), rgba(var(--verde), 0.12));
			border: 1px solid rgba(var(--verde), 0.5);
			box-shadow: 0 8px 20px rgba(var(--verde), 0.25);
		}
		.marca-icone svg { width: 22px; height: 22px; fill: #dcffe9; }
		.marca h1 { font-size: 21px; font-weight: 800; letter-spacing: 0.2px; }
		.marca p { font-size: 12.5px; font-weight: 600; color: rgb(var(--suave)); margin-top: 2px; }
		.cabecalho-acoes { display: flex; align-items: center; gap: 10px; }

		.chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 999px; font-size: 12px; font-weight: 800; background: rgba(var(--verde), 0.12); color: #a3ecc2; border: 1px solid rgba(var(--verde), 0.32); }
		.chip svg { width: 14px; height: 14px; fill: currentColor; }
		.chip.desligado { background: rgba(255, 255, 255, 0.04); color: rgb(var(--suave)); border-color: rgba(255, 255, 255, 0.1); }

		.fechar { display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 13px 0 6px; border-radius: 11px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: rgb(var(--suave)); font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background 0.2s, color 0.2s; }
		.fechar:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
		.tecla { display: inline-grid; place-items: center; min-width: 32px; height: 22px; padding: 0 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); border-bottom-width: 2px; font-size: 10.5px; font-weight: 800; color: #fff; }

		/* colunas */
		.estacao { position: relative; display: grid; grid-template-columns: 262px 1fr 300px; gap: 16px; height: 560px; }
		.coluna { display: flex; flex-direction: column; min-height: 0; }
		.coluna-titulo { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 10px; font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: rgb(var(--suave)); }
		.coluna-titulo b { display: inline-grid; place-items: center; min-width: 24px; height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); color: #dfe6e2; font-size: 13px; letter-spacing: 0; }
		.rolagem { flex: 1; overflow-y: auto; padding: 2px 6px 2px 2px; margin-right: -6px; }
		.rolagem::-webkit-scrollbar { width: 4px; }
		.rolagem::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 2px; }

		/* vapes da mochila */
		.vape-card {
			--c: 150, 156, 162;
			position: relative;
			display: flex;
			gap: 12px;
			width: 100%;
			padding: 11px;
			margin-bottom: 9px;
			border-radius: 14px;
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid rgba(255, 255, 255, 0.06);
			cursor: pointer;
			transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
		}
		.vape-card:hover { background: rgba(255, 255, 255, 0.055); transform: translateY(-1px); }
		.vape-card.escolhido { border-color: rgba(var(--c), 0.75); background: linear-gradient(135deg, rgba(var(--c), 0.17), rgba(var(--c), 0.04)); box-shadow: 0 8px 22px rgba(var(--c), 0.14), inset 0 0 0 1px rgba(var(--c), 0.18); }
		.vape-thumb { flex: 0 0 58px; height: 58px; border-radius: 12px; display: grid; place-items: center; background: radial-gradient(circle at 50% 62%, rgba(var(--c), 0.32), rgba(255, 255, 255, 0.025) 72%); }
		.vape-thumb img { width: 52px; height: 52px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45)); }
		.vape-info { flex: 1; min-width: 0; }
		.vape-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
		.vape-topo b { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
		.vape-topo span { font-size: 16px; font-weight: 700; }
		.vape-topo small { font-size: 11px; color: rgb(var(--suave)); margin-left: 1px; }
		.vape-sabor { display: flex; align-items: center; gap: 6px; margin: 2px 0 8px; font-size: 11.5px; font-weight: 700; color: #c9d2cd; }
		.vape-sabor i { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--c)); box-shadow: 0 0 8px rgb(var(--c)); }
		.vape-card .barra { height: 5px; }
		.vape-card .barra i { background: linear-gradient(90deg, rgba(var(--c), 0.7), rgb(var(--c))); }
		.vape-meta { display: flex; gap: 12px; margin-top: 7px; font-size: 10.5px; font-weight: 700; color: rgb(var(--suave)); }

		/* palco */
		.palco {
			position: relative;
			border-radius: 18px;
			overflow: hidden;
			background:
				radial-gradient(circle at 50% 64%, rgba(var(--tanque), 0.24), rgba(var(--tanque), 0) 44%),
				linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012));
			border: 1px solid rgba(255, 255, 255, 0.07);
		}
		.palco::before {
			content: "";
			position: absolute;
			inset: 0;
			background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
			background-size: 28px 28px;
			-webkit-mask-image: radial-gradient(ellipse at 50% 72%, #000 0%, transparent 62%);
			pointer-events: none;
		}

		.passos { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.06); white-space: nowrap; }
		.passo { display: flex; align-items: center; gap: 7px; padding: 5px 12px 5px 5px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: rgb(var(--suave)); transition: background 0.3s, color 0.3s; }
		.passo span { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; background: rgba(255, 255, 255, 0.07); color: #cfd7d3; font-size: 11px; font-weight: 800; }
		.passo span svg { width: 13px; height: 13px; fill: currentColor; }
		.passo.feito span { background: rgba(var(--verde), 0.28); color: #95f2bb; }
		.passo.atual { background: rgba(var(--verde), 0.2); color: #eafff2; }
		.passo.atual span { background: rgb(var(--verde)); color: #04110a; }

		.leitura { position: absolute; left: 24px; top: 74px; z-index: 4; }
		.rotulo { font-size: 10.5px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: rgb(var(--suave)); }
		.valor { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 10px; }
		.valor b { font-size: 50px; line-height: 1; font-weight: 700; }
		.valor span { font-size: 16px; font-weight: 600; color: rgb(var(--suave)); }
		.chip-sabor { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(var(--tanque), 0.14); border: 1px solid rgba(var(--tanque), 0.42); font-size: 12.5px; font-weight: 800; }
		.chip-sabor i { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--tanque)); box-shadow: 0 0 10px rgb(var(--tanque)); }
		.chip-sabor.vazio { background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.1); color: rgb(var(--suave)); }
		.chip-sabor.vazio i { background: rgba(255, 255, 255, 0.25); box-shadow: none; }
		.efeito-txt { margin-top: 9px; font-size: 12px; font-weight: 700; color: rgb(var(--suave)); }
		.efeito-txt b { color: #e9efec; }

		.ficha { position: absolute; left: 24px; top: 268px; z-index: 4; display: flex; flex-direction: column; gap: 11px; width: 150px; }
		.ficha-linha > div:first-child { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; font-weight: 700; color: rgb(var(--suave)); }
		.ficha-linha b { font-size: 15px; color: #e6ece9; }
		.ficha-linha .barra { height: 4px; margin-top: 5px; }
		.ficha-linha .barra i { background: linear-gradient(90deg, rgba(var(--verde), 0.6), rgb(var(--verde))); }

		.vitrine { position: absolute; left: 50%; top: 66px; width: 260px; height: 440px; margin-left: -130px; perspective: 900px; z-index: 2; }
		.pedestal { position: absolute; left: 50%; bottom: 6px; width: 220px; height: 50px; margin-left: -110px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(var(--tanque), 0.5), rgba(var(--tanque), 0.1) 55%, transparent 72%); }
		.pedestal::before { content: ""; position: absolute; inset: 9px 26px; border-radius: 50%; border: 1px solid rgba(var(--tanque), 0.6); box-shadow: 0 0 18px rgba(var(--tanque), 0.5), inset 0 0 14px rgba(var(--tanque), 0.4); }
		.pedestal::after { content: ""; position: absolute; left: 50%; bottom: 24px; width: 150px; height: 300px; margin-left: -75px; background: linear-gradient(to top, rgba(var(--tanque), 0.16), transparent 80%); clip-path: polygon(32% 0, 68% 0, 100% 100%, 0 100%); }
		.flutua { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; animation: flutuar 5s ease-in-out infinite; }
		@keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
		.modelo { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.35s ease-out; filter: drop-shadow(0 22px 20px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 26px rgba(var(--tanque), 0.2)); }
		.modelo svg { display: block; width: 168px; height: 384px; overflow: visible; }
		.modelo .bocal { cursor: pointer; transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); transform-box: fill-box; transform-origin: 100% 100%; }
		.modelo.aberto .bocal { transform: translate(34px, -26px) rotate(34deg); }
		.toque { position: absolute; left: 50%; top: 2px; width: 46px; height: 46px; margin-left: -23px; border-radius: 50%; border: 2px solid rgba(var(--verde), 0.95); pointer-events: none; animation: pulso 1.6s ease-out infinite; }
		.toque.oculto { display: none; }
		@keyframes pulso { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.5); opacity: 0; } }

		#liq { transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), color 0.6s; }
		.onda { animation: onda 2.6s linear infinite; }
		@keyframes onda { to { transform: translateX(-30px); } }
		.bolha { opacity: 0; animation: bolha 3.2s ease-in infinite; }
		@keyframes bolha { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.55; } 100% { transform: translateY(-40px); opacity: 0; } }
		.tela { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 15px; }
		.marca-volt { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 9.5px; letter-spacing: 2.5px; }

		/* frasco no palco */
		.garrafa { position: absolute; right: 28px; top: 132px; z-index: 6; width: 116px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transform-origin: 50% 0; transition: transform 0.75s cubic-bezier(0.45, 0.05, 0.25, 1), opacity 0.3s; }
		.garrafa svg { width: 96px; height: 180px; overflow: visible; filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 18px rgba(var(--frasco), 0.25)); }
		.passos { transition: opacity 0.3s; }
		.palco.despejando .passos { opacity: 0.15; }
		.garrafa.oculta { opacity: 0; pointer-events: none; transform: translateX(24px); }
		.garrafa.pronta svg { animation: chamar 1.8s ease-in-out infinite; }
		@keyframes chamar { 50% { transform: translateY(-6px) rotate(-5deg); } }
		.garrafa.bloqueada { cursor: default; }
		.garrafa.bloqueada svg { opacity: 0.6; }
		.legenda { margin-top: 10px; text-align: center; font-size: 13px; font-weight: 800; transition: opacity 0.2s; }
		.legenda small { display: block; margin-top: 1px; font-size: 13px; font-weight: 600; color: rgb(var(--suave)); }
		.garrafa.despejando .legenda { opacity: 0; }

		.jato { position: absolute; z-index: 5; width: 5px; border-radius: 3px; background: linear-gradient(rgb(var(--frasco)), rgba(var(--frasco), 0.75)); box-shadow: 0 0 12px rgba(var(--frasco), 0.85); transform-origin: top; transform: scaleY(0); opacity: 0; transition: transform 0.4s ease-in, opacity 0.25s; }
		.jato.ativo { transform: scaleY(1); opacity: 1; }

		.dica { position: absolute; left: 0; right: 0; bottom: 18px; z-index: 4; text-align: center; font-size: 13px; font-weight: 600; color: rgb(var(--suave)); }
		.dica b { color: #fff; }

		/* frascos da mochila */
		.liquidos { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; align-content: start; }
		.frasco-card {
			--c: 46, 139, 87;
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 12px 8px 10px;
			border-radius: 14px;
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid rgba(255, 255, 255, 0.06);
			cursor: pointer;
			text-align: center;
			transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
		}
		.frasco-card:hover { background: rgba(var(--c), 0.1); border-color: rgba(var(--c), 0.4); transform: translateY(-1px); }
		.frasco-card.escolhido { background: linear-gradient(160deg, rgba(var(--c), 0.24), rgba(var(--c), 0.05)); border-color: rgba(var(--c), 0.85); box-shadow: 0 8px 20px rgba(var(--c), 0.18); }
		.frasco-card.vazio { opacity: 0.3; cursor: default; pointer-events: none; filter: grayscale(0.6); }
		.frasco-card img { width: 48px; height: 48px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4)); }
		.frasco-nome { margin-top: 6px; font-size: 12.5px; font-weight: 800; }
		.frasco-efeito { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; padding: 3px 9px; border-radius: 999px; background: rgba(var(--c), 0.16); font-size: 10.5px; font-weight: 800; color: #e9efec; }
		.frasco-efeito i { width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--c)); }
		.frasco-qtd { position: absolute; top: 7px; right: 9px; font-size: 14px; font-weight: 700; color: #dfe6e2; }
		.frasco-aberto { width: 100%; margin-top: 8px; }
		.frasco-aberto .barra { height: 3px; }
		.frasco-aberto .barra i { background: rgb(var(--c)); }
		.frasco-aberto span { display: block; margin-top: 3px; font-size: 10px; font-weight: 700; color: rgb(var(--suave)); }

		/* rodapé */
		.rodape { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
		.mensagem { display: flex; align-items: center; gap: 10px; min-height: 24px; font-size: 13px; font-weight: 600; color: rgb(var(--suave)); }
		.mensagem svg { flex: none; width: 18px; height: 18px; fill: currentColor; }
		.mensagem.aviso { color: #f2b84f; }
		.mensagem.mistura { color: #a3ecc2; }
		.botao {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			height: 48px;
			padding: 0 26px;
			border: none;
			border-radius: 13px;
			font-family: inherit;
			font-size: 14.5px;
			font-weight: 800;
			color: var(--acao-texto);
			background: linear-gradient(135deg, rgb(var(--acao)) 0%, rgba(var(--acao), 0.8) 100%);
			box-shadow: 0 10px 26px rgba(var(--acao), 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.35);
			cursor: pointer;
			transition: transform 0.15s, filter 0.2s, box-shadow 0.2s, opacity 0.2s;
		}
		.botao:hover { filter: brightness(1.08); transform: translateY(-1px); }
		.botao:disabled { background: rgba(255, 255, 255, 0.07); color: rgba(255, 255, 255, 0.4); box-shadow: none; cursor: default; transform: none; filter: none; }
		.botao svg { width: 18px; height: 18px; fill: currentColor; }
	</style>
</head>
<body>
	<div id="vape">
		<div class="topo"><span id="nome">Vape</span><span class="num" id="ml">0.0 / 5 ml</span></div>
		<div class="sabor"><span class="ponto"></span><span id="sabor">Tanque vazio</span></div>

			</div>
		</div>
	</div>

	<script>
		const $ = (Id) => document.getElementById(Id);
		const Post = (Name, Data = {}) => fetch(`https://${GetParentResourceName()}/${Name}`, { method: "POST", body: JSON.stringify(Data) }).catch(() => {});
		const Verde = [46, 139, 87];
		const Cinza = [150, 156, 162];
		const Rgb = (Cor) => (Cor || Cinza).join(", ");
		const Fmt = (Ml) => (Math.round((Ml || 0) * 10) / 10).toFixed(1);
		const Claro = (Cor) => (Cor[0] * 299 + Cor[1] * 587 + Cor[2] * 114) / 1000 > 150;
		const Imagem = (Item) => `nui://vrp/config/inventory/${Item}.png`;

		const Icone = {
			mistura: '<svg viewBox="0 0 24 24"><path d="M9 3h6v2h-1v4.3l5.5 9.2A1.7 1.7 0 0 1 18 21H6a1.7 1.7 0 0 1-1.5-2.5L10 9.3V5H9V3zm3 8.1L8.6 17h6.8L12 11.1z"/></svg>',
			aviso: '<svg viewBox="0 0 24 24"><path d="M12 2.8 1.6 20.5h20.8L12 2.8zm-1 6.2h2v5.5h-2V9zm0 7.3h2v2h-2v-2z"/></svg>',
			info: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 5h2v2h-2V7zm0 4h2v6h-2v-6z"/></svg>',
			check: '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
			gota: '<svg viewBox="0 0 24 24"><path d="M12 2.6c-3.6 4.6-6.4 8.3-6.4 11.8a6.4 6.4 0 0 0 12.8 0c0-3.5-2.8-7.2-6.4-11.8z"/></svg>',
			abrir: '<svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 9.6-2l-1.8.8A3 3 0 0 0 9 8v3h9a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h1zm5 3.5a1.5 1.5 0 0 0-1 2.6V19h2v-1.9a1.5 1.5 0 0 0-1-2.6z"/></svg>'
		};

		// a janela encolhe em telas menores
		function AjustarEscala() {
			const Escala = Math.min(1, window.innerWidth / 1290, window.innerHeight / 790);
			document.documentElement.style.setProperty("--escala", Escala);
		}
		window.addEventListener("resize", AjustarEscala);
		AjustarEscala();

		// ---------- som da puxada (loop enquanto segura, some devagar ao soltar) ----------
		const Som = { Ctx: null, Buffer: null, Fonte: null, Ganho: null };

		async function CarregarSom() {
			Som.Ctx = Som.Ctx || new AudioContext();
			if (Som.Ctx.state === "suspended") await Som.Ctx.resume();
			if (Som.Buffer) return Som.Buffer;
			const Resposta = await fetch("vape-loop.wav");
			Som.Buffer = await Som.Ctx.decodeAudioData(await Resposta.arrayBuffer());
			return Som.Buffer;
		}

		async function TocarPuxada(Volume) {
			try {
				const Buffer = await CarregarSom();
				PararPuxada(0);
				const Agora = Som.Ctx.currentTime;
				Som.Ganho = Som.Ctx.createGain();
				Som.Ganho.gain.setValueAtTime(0, Agora);
				Som.Ganho.gain.linearRampToValueAtTime(Math.max(0, Math.min(1, Volume ?? 0.35)), Agora + 0.15);
				Som.Ganho.connect(Som.Ctx.destination);
				Som.Fonte = Som.Ctx.createBufferSource();
				Som.Fonte.buffer = Buffer;
				Som.Fonte.loop = true;
				Som.Fonte.connect(Som.Ganho);
				Som.Fonte.start();
			} catch (Erro) {}
		}

		function PararPuxada(Fade = 0.3) {
			if (!Som.Fonte) return;
			const Fonte = Som.Fonte, Ganho = Som.Ganho, Agora = Som.Ctx.currentTime;
			Ganho.gain.cancelScheduledValues(Agora);
			Ganho.gain.setValueAtTime(Ganho.gain.value, Agora);
			Ganho.gain.linearRampToValueAtTime(0, Agora + Fade);
			Fonte.stop(Agora + Fade + 0.02);
			Som.Fonte = null;
			Som.Ganho = null;
		}

		// ---------- card do vape na mão ----------
		function Atualizar(Data) {
			const Cor = Data.Color || Verde;
			const Fracao = Data.Capacity > 0 ? Math.max(0, Math.min(1, Data.Ml / Data.Capacity)) : 0;

			$("vape").style.setProperty("--cor", Rgb(Cor));
			$("nome").textContent = Data.Name || "Vape";
			$("ml").textContent = `${Fmt(Data.Ml)} / ${Fmt(Data.Capacity)} ml`;
			$("sabor").textContent = Data.Flavor && Data.Ml > 0 ? Data.Flavor : "Tanque vazio";
			$("nivel").style.width = `${Fracao * 100}%`;
			$("tanque").classList.toggle("baixo", Fracao > 0 && Fracao <= 0.15);

			const Efeito = Data.Effect;
			$("efeito").classList.toggle("ativo", !!Efeito);
			if (Efeito) {
				$("efeito-nome").textContent = Efeito.Label;
				$("efeito-tempo").textContent = `${Efeito.Seconds}s`;
				$("efeito-barra").style.width = `${Math.max(0, Efeito.Left) * 100}%`;
			}
		}

		// ---------- desenho dos vapes (SVG 140x320) ----------
		function Onda(X, W, Fechada = true) {
			let D = `M${X - 30} 0 q7.5 -3 15 0`;
			for (let i = 1; i < Math.ceil((W + 60) / 15); i++) D += " t15 0";
			return Fechada ? D + ` V 420 H ${X - 30} Z` : D;
		}

		const Comum = `
			<linearGradient id="g-metal" x1="0" x2="1"><stop offset="0" stop-color="#5a6067"/><stop offset=".32" stop-color="#eef1f4"/><stop offset=".58" stop-color="#9ea5ad"/><stop offset="1" stop-color="#454a50"/></linearGradient>
			<linearGradient id="g-vidro" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".18" stop-color="#fff" stop-opacity=".06"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset=".9" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
			<linearGradient id="g-cilindro" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".28" stop-color="#000" stop-opacity="0"/><stop offset=".42" stop-color="#fff" stop-opacity=".1"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
			<linearGradient id="g-sombra" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
			<pattern id="listras" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect id="listra" width="3" height="6" fill="#fff"/></pattern>`;

		const Modelos = {
			// box mod preto com tela verde (igual à imagem do item "vape")
			classic: {
				Tanque: { x: 51, y: 51, w: 38, h: 82, r: 2 },
				Abertura: 44,
				Cor: '<linearGradient id="g-corpo" x1="0" x2="1"><stop offset="0" stop-color="#0a0b0d"/><stop offset=".3" stop-color="#363a40"/><stop offset=".55" stop-color="#17191c"/><stop offset="1" stop-color="#050506"/></linearGradient>',
				Corpo: `
					<rect x="49" y="42" width="42" height="9" rx="2" fill="url(#g-metal)"/>
					<rect x="49" y="133" width="42" height="11" rx="2" fill="url(#g-metal)"/>
					<rect x="28" y="146" width="84" height="166" rx="18" fill="url(#g-corpo)"/>
					<rect x="28" y="146" width="84" height="166" rx="18" fill="none" stroke="#fff" stroke-opacity=".08"/>
					<rect x="35" y="153" width="9" height="150" rx="4.5" fill="#fff" opacity=".07"/>
					<rect x="47" y="176" width="46" height="28" rx="5" fill="#04110a" stroke="#1e3d2b" stroke-width="1.5"/>
					<text id="tela" x="70" y="196" text-anchor="middle" class="tela" fill="#3ee07a">0.0</text>
					<circle cx="70" cy="246" r="12" fill="url(#g-metal)"/>
					<circle cx="70" cy="246" r="8" fill="#1f2226"/>
					<rect x="61" y="296" width="18" height="4" rx="2" fill="#020203"/>`,
				Frente: `<rect x="50.5" y="51" width="39" height="82" rx="2" fill="url(#g-vidro)" stroke="#fff" stroke-opacity=".35"/>`,
				Bocal: `
					<rect x="52" y="33" width="36" height="10" rx="2.5" fill="#2a2e33"/>
					<rect x="60" y="13" width="20" height="22" rx="3" fill="url(#g-metal)"/>
					<rect x="56" y="6" width="28" height="10" rx="4" fill="url(#g-metal)"/>
					<rect x="63" y="6" width="14" height="3" rx="1.5" fill="#0d0f11" opacity=".55"/>`
			},
			// pod arredondado azul → roxo com janela do líquido (igual à imagem do item "vape_pro")
			pro: {
				Tanque: { x: 57, y: 77, w: 26, h: 98, r: 12 },
				Abertura: 46,
				Cor: '<linearGradient id="g-corpo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6ff5"/><stop offset="1" stop-color="#7b3ae8"/></linearGradient>',
				Corpo: `
					<rect x="34" y="40" width="72" height="272" rx="32" fill="url(#g-corpo)"/>
					<rect x="34" y="40" width="72" height="272" rx="32" fill="url(#g-cilindro)"/>
					<rect x="43" y="60" width="11" height="232" rx="5.5" fill="#fff" opacity=".14"/>
					<rect x="54" y="74" width="32" height="104" rx="15" fill="#0b0d14" stroke="#fff" stroke-opacity=".22"/>
					<circle cx="70" cy="228" r="10" fill="#0b0d14"/>
					<circle cx="70" cy="228" r="6" fill="none" stroke="#5ef0ff" stroke-width="2"/>
					<circle cx="70" cy="228" r="9" fill="none" stroke="#5ef0ff" stroke-opacity=".25" stroke-width="2"/>`,
				Frente: `<rect x="57" y="77" width="26" height="98" rx="12" fill="url(#g-vidro)"/>`,
				Bocal: `
					<path d="M50 44 L54 12 Q70 4 86 12 L90 44 Z" fill="#1a1d22" stroke="#fff" stroke-opacity=".22"/>
					<path d="M56 14 Q70 8 84 14 L85 22 Q70 16 55 22 Z" fill="#fff" opacity=".08"/>
					<rect x="64" y="8" width="12" height="3" rx="1.5" fill="#000" opacity=".6"/>`
			},
			// cilindro azul com bico de metal e tela (igual à imagem do item "vape_volt")
			volt: {
				Tanque: { x: 47, y: 55, w: 46, h: 70, r: 2 },
				Abertura: 47,
				Cor: '<linearGradient id="g-corpo" x1="0" x2="1"><stop offset="0" stop-color="#08214f"/><stop offset=".36" stop-color="#2d7bef"/><stop offset=".62" stop-color="#1450b8"/><stop offset="1" stop-color="#061633"/></linearGradient>',
				Corpo: `
					<rect x="45" y="46" width="50" height="9" rx="2" fill="url(#g-metal)"/>
					<rect x="45" y="125" width="50" height="10" rx="2" fill="url(#g-metal)"/>
					<rect x="38" y="137" width="64" height="175" rx="15" fill="url(#g-corpo)"/>
					<rect x="38" y="137" width="64" height="175" rx="15" fill="url(#g-cilindro)"/>
					<rect x="56" y="152" width="28" height="13" rx="3" fill="url(#g-metal)"/>
					<rect x="57" y="174" width="26" height="32" rx="4" fill="#030b18" stroke="#1d3b66"/>
					<text id="tela" x="70" y="195" text-anchor="middle" class="tela" fill="#7cc4ff">0.0</text>
					<text x="70" y="236" text-anchor="middle" class="marca-volt" fill="#dfe9ff">VOLT</text>
					<circle cx="70" cy="250" r="2.6" fill="#5ab0ff"/>
					<rect x="46" y="288" width="48" height="1.6" fill="#fff" opacity=".2"/>
					<rect x="46" y="294" width="48" height="1.6" fill="#fff" opacity=".14"/>`,
				Frente: `
					<rect x="47" y="55" width="46" height="70" rx="2" fill="url(#g-vidro)" stroke="#fff" stroke-opacity=".3"/>
					<rect x="52" y="55" width="3" height="70" fill="url(#g-metal)"/>
					<rect x="85" y="55" width="3" height="70" fill="url(#g-metal)"/>`,
				Bocal: `
					<rect x="49" y="38" width="42" height="9" rx="2" fill="#1b2027"/>
					<path d="M57 39 L62 9 H78 L83 39 Z" fill="url(#g-metal)"/>
					<rect x="60" y="4" width="20" height="7" rx="3" fill="url(#g-metal)"/>
					<rect x="65" y="4" width="10" height="2.5" rx="1.2" fill="#0d0f11" opacity=".6"/>`
			}
		};

		let ModeloAtual = null;

		function MontarVape(Style) {
			const M = Modelos[Style] || Modelos.classic;
			const T = M.Tanque;
			const Bolhas = [0.25, 0.55, 0.75, 0.4, 0.62].map((P, i) =>
				`<circle class="bolha" cx="${T.x + T.w * P}" cy="${16 + i * 9}" r="${1.1 + (i % 3) * 0.5}" fill="#fff" style="animation-delay:${i * 0.65}s"/>`).join("");

			$("modelo").innerHTML = `
				<svg viewBox="0 0 140 320">
					<defs>${Comum}${M.Cor}<clipPath id="clip-tanque"><rect x="${T.x}" y="${T.y}" width="${T.w}" height="${T.h}" rx="${T.r}"/></clipPath></defs>
					${M.Corpo}
					<rect x="${T.x}" y="${T.y}" width="${T.w}" height="${T.h}" rx="${T.r}" fill="#fff" fill-opacity=".05"/>
					<g clip-path="url(#clip-tanque)">
						<rect id="previa" x="${T.x}" y="${T.y + T.h}" width="${T.w}" height="0" fill="url(#listras)" opacity=".75"/>
						<g id="liq" style="transform: translateY(${T.y + T.h + 5}px)">
							<g class="onda">
								<path d="${Onda(T.x, T.w)}" fill="currentColor"/>
								<path d="${Onda(T.x, T.w, false)}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1"/>
							</g>
							${Bolhas}
						</g>
						<rect x="${T.x}" y="${T.y}" width="${T.w}" height="${T.h}" fill="url(#g-sombra)"/>
					</g>
					${M.Frente}
					<g class="bocal" id="bocal">${M.Bocal}</g>
				</svg>`;

			ModeloAtual = M;
			$("bocal").addEventListener("click", AlternarBocal);
		}

		function Altura(Fracao) {
			const T = ModeloAtual.Tanque;
			return T.y + T.h - Math.max(0, Math.min(1, Fracao)) * T.h;
		}

		function Nivel(Fracao, Cor, Ml) {
			if (!ModeloAtual) return;
			const T = ModeloAtual.Tanque;
			const Liq = $("liq");
			Liq.style.transform = `translateY(${Fracao > 0.004 ? Altura(Fracao) : T.y + T.h + 5}px)`;
			Liq.style.color = `rgb(${Rgb(Cor)})`;
			if ($("tela")) $("tela").textContent = Fmt(Ml);
		}

		function Previa(De, Para, Cor) {
			const R = $("previa");
			if (!R) return;
			if (Para <= De) { R.setAttribute("height", 0); return; }
			const Topo = Altura(Para), Base = Altura(De);
			R.setAttribute("y", Topo);
			R.setAttribute("height", Base - Topo + 2);
			$("listra").setAttribute("fill", `rgb(${Rgb(Cor)})`);
		}

		// frasco conta-gotas (igual às imagens dos líquidos)
		function GarrafaSvg(Cor, Fracao) {
			const C = `rgb(${Rgb(Cor)})`;
			const Desce = (1 - Math.max(0, Math.min(1, Fracao))) * 88;
			return `
				<svg viewBox="0 0 80 150">
					<defs><clipPath id="b-clip"><rect x="14" y="56" width="52" height="88" rx="10"/></clipPath></defs>
					<rect x="31" y="3" width="18" height="27" rx="9" fill="#2a2e33" stroke="#fff" stroke-opacity=".22"/>
					<rect x="35" y="7" width="4" height="18" rx="2" fill="#fff" opacity=".22"/>
					<rect x="26" y="28" width="28" height="18" rx="3" fill="#34383e" stroke="#fff" stroke-opacity=".18"/>
					<rect x="26" y="32" width="28" height="1.5" fill="#000" opacity=".45"/>
					<rect x="26" y="36" width="28" height="1.5" fill="#000" opacity=".45"/>
					<rect x="26" y="40" width="28" height="1.5" fill="#000" opacity=".45"/>
					<rect x="30" y="46" width="20" height="9" fill="#454a50"/>
					<rect x="13" y="55" width="54" height="90" rx="11" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".32"/>
					<g clip-path="url(#b-clip)"><rect id="b-liq" x="14" y="56" width="52" height="88" fill="${C}" style="transform: translateY(${Desce}px); transition: transform 1.2s ease"/></g>
					<rect x="13" y="82" width="54" height="32" fill="#fff" opacity=".92"/>
					<rect x="13" y="87" width="54" height="22" fill="${C}"/>
					<circle cx="40" cy="98" r="7" fill="#fff"/>
					<circle cx="40" cy="98" r="3.8" fill="${C}"/>
					<rect x="13" y="55" width="54" height="90" rx="11" fill="url(#g-vidro)"/>
				</svg>`;
		}

		// ---------- estação de recarga ----------
		let Estacao = null;
		let VapeSel = null;
		let FrascoSel = null;
		let Aberto = false;
		let Despejando = false;
		let Trava = null;

		const Vape = () => Estacao && Estacao.Vapes.find((V) => V.Item === VapeSel);
		const Frasco = () => Estacao && Estacao.Liquids.find((L) => L.Item === FrascoSel);

		// quanto o frasco escolhido tem para despejar (frasco aberto ou um fechado novo)
		function Disponivel(L) {
			if (!L) return 0;
			if (L.Open > 0) return L.Open;
			return L.Amount > 0 ? Estacao.Bottle : 0;
		}

		function Situacao() {
			const V = Vape(), L = Frasco();
			if (!V || !L) return { Pode: false };

			const Espaco = Math.max(0, V.Capacity - V.Ml);
			const Outro = V.Ml > 0 && V.Flavor && V.Flavor !== L.Item;
			if (Outro && !Estacao.AllowMix) return { Pode: false, Tipo: "aviso", Aviso: `Esse tanque tem ${V.FlavorName}. Esvazie antes de colocar ${L.Name}.` };
			if (Espaco < 0.01) return { Pode: false, Tipo: "aviso", Aviso: "O tanque desse vape já está cheio." };

			const Despeja = Math.min(Espaco, Disponivel(L));
			if (Despeja <= 0) return { Pode: false, Tipo: "aviso", Aviso: `Você não tem ${L.Name}.` };

			const Sobra = Disponivel(L) - Despeja;
			const Resto = Sobra > 0.01 ? ` Sobram ${Fmt(Sobra)} ml no frasco aberto.` : "";
			if (Outro) return { Pode: true, Despeja, Tipo: "mistura", Aviso: `Mistura: o tanque inteiro passa a ser ${L.Name}.${Resto}` };
			return { Pode: true, Despeja, Tipo: "info", Aviso: Resto ? Resto.trim() : "O frasco inteiro vai para o tanque." };
		}

		function RenderVapes() {
			const Caixa = $("vapes");
			Caixa.innerHTML = "";
			$("conta-vapes").textContent = Estacao.Vapes.length;

			for (const Item of Estacao.Vapes) {
				const Card = document.createElement("div");
				Card.className = "vape-card" + (Item.Item === VapeSel ? " escolhido" : "");
				Card.style.setProperty("--c", Rgb(Item.Color));
				Card.innerHTML = `
					<div class="vape-thumb"><img src="${Imagem(Item.Item)}" onerror="this.style.opacity=0"></div>
					<div class="vape-info">
						<div class="vape-topo"><b>${Item.Name}</b><span class="num">${Fmt(Item.Ml)}<small>/${Fmt(Item.Capacity)} ml</small></span></div>
						<div class="vape-sabor"><i></i>${Item.FlavorName || "Tanque vazio"}</div>
						<div class="barra"><i style="width:${Math.min(100, (Item.Ml / Item.Capacity) * 100)}%"></i></div>
						<div class="vape-meta"><span>Gasto ${Item.Consumption.toFixed(1)}x</span><span>Nuvem ${(Item.Cloud || 1).toFixed(1)}x</span></div>
					</div>`;
				Card.addEventListener("click", () => {
					if (Despejando || VapeSel === Item.Item) return;
					VapeSel = Item.Item;
					Aberto = false;
					MontarVape(Item.Style);
					Desenhar();
				});
				Caixa.appendChild(Card);
			}
		}

		function RenderFrascos() {
			const Caixa = $("lista");
			Caixa.innerHTML = "";
			$("conta-frascos").textContent = Estacao.Liquids.filter((L) => L.Amount > 0 || L.Open > 0).length;

			for (const Item of Estacao.Liquids) {
				const Tem = Item.Amount > 0 || Item.Open > 0;
				const Card = document.createElement("div");
				Card.className = "frasco-card" + (Tem ? "" : " vazio") + (Item.Item === FrascoSel ? " escolhido" : "");
				Card.style.setProperty("--c", Rgb(Item.Color));
				Card.innerHTML = `
					<span class="frasco-qtd num">${Item.Amount > 0 ? "x" + Item.Amount : ""}</span>
					<img src="${Imagem(Item.Item)}" onerror="this.style.opacity=0">
					<div class="frasco-nome">${Item.Name}</div>
					${Item.Effect ? `<div class="frasco-efeito"><i></i>${Item.Effect}</div>` : ""}
					${Item.Open > 0 ? `<div class="frasco-aberto"><div class="barra"><i style="width:${(Item.Open / Estacao.Bottle) * 100}%"></i></div><span>Aberto · ${Fmt(Item.Open)} ml</span></div>` : ""}`;
				Card.addEventListener("click", () => {
					if (Despejando) return;
					FrascoSel = Item.Item;
					Desenhar();
				});
				Caixa.appendChild(Card);
			}
		}

		function RenderPalco() {
			const V = Vape(), L = Frasco(), S = Situacao();
			const Recarga = $("recarga");
			Recarga.style.setProperty("--tanque", Rgb(V && V.Ml > 0 && V.Color ? V.Color : Verde));
			Recarga.style.setProperty("--frasco", Rgb(L ? L.Color : Verde));

			$("modelo").classList.toggle("aberto", Aberto);
			$("toque").classList.toggle("oculto", Aberto || !V);

			if (V && !Despejando) {
				Nivel(V.Ml / V.Capacity, V.Color || Cinza, V.Ml);
				if (Aberto && S.Pode) Previa(V.Ml / V.Capacity, (V.Ml + S.Despeja) / V.Capacity, L.Color);
				else Previa(0, 0);
			}

			// passo a passo
			const Etapas = [["Escolha o vape", !!V], ["Abra o bocal", Aberto], ["Despeje o frasco", false]];
			const Atual = Etapas.findIndex((E) => !E[1]);
			$("passos").innerHTML = Etapas.map(([Texto, Feito], i) =>
				`<div class="passo${Feito ? " feito" : ""}${i === Atual ? " atual" : ""}"><span>${Feito ? Icone.check : i + 1}</span>${Texto}</div>`).join("");

			// leitura do tanque
			const Sabor = V && V.Ml > 0 && Estacao.Liquids.find((Item) => Item.Item === V.Flavor);
			$("leitura").innerHTML = V ? `
				<div class="rotulo">Nível do tanque</div>
				<div class="valor num"><b>${Fmt(V.Ml)}</b><span>/ ${Fmt(V.Capacity)} ml</span></div>
				<div class="chip-sabor${V.Ml > 0 ? "" : " vazio"}"><i></i>${V.Ml > 0 && V.FlavorName ? V.FlavorName : "Tanque vazio"}</div>
				${Sabor && Sabor.Effect ? `<div class="efeito-txt">Efeito <b>${Sabor.Effect}</b></div>` : ""}` : "";

			$("ficha").innerHTML = V ? [
				["Tanque", `${Fmt(V.Capacity)} ml`, V.Capacity / 5],
				["Gasto", `${V.Consumption.toFixed(1)}x`, V.Consumption / 2],
				["Nuvem", `${(V.Cloud || 1).toFixed(1)}x`, (V.Cloud || 1) / 1.5]
			].map(([Rotulo, Valor, Parte]) => `
				<div class="ficha-linha">
					<div><span>${Rotulo}</span><b class="num">${Valor}</b></div>
					<div class="barra"><i style="width:${Math.min(100, Parte * 100)}%"></i></div>
				</div>`).join("") : "";

			// frasco escolhido
			const Garrafa = $("garrafa");
			if (L && !Despejando) {
				Garrafa.innerHTML = GarrafaSvg(L.Color, Disponivel(L) / Estacao.Bottle) +
					`<div class="legenda">${L.Name}<small class="num">${L.Open > 0 ? "Aberto · " + Fmt(L.Open) : Fmt(Estacao.Bottle)} ml</small></div>`;
			}
			Garrafa.classList.toggle("oculta", !L);
			Garrafa.classList.toggle("pronta", Aberto && S.Pode && !Despejando);
			Garrafa.classList.toggle("bloqueada", !(Aberto && S.Pode));

			let Dica = "";
			if (Despejando) Dica = "Despejando...";
			else if (V && !Aberto) Dica = "Clique no <b>bocal</b> do vape para abrir";
			else if (V && !L) Dica = "Escolha um <b>frasco</b> na lista à direita";
			else if (S.Pode) Dica = "Clique no <b>frasco</b> para despejar";
			$("dica").innerHTML = Dica;
		}

		function RenderRodape() {
			const V = Vape(), L = Frasco(), S = Situacao();

			// avisos da recarga só depois de abrir o bocal
			if (!Aberto) S.Aviso = "";
			const Mensagem = $("mensagem");
			const Tipo = S.Aviso ? S.Tipo : "info";
			Mensagem.className = "mensagem " + Tipo;
			Mensagem.innerHTML = (Tipo === "aviso" ? Icone.aviso : Tipo === "mistura" ? Icone.mistura : Icone.info) +
				`<span>${S.Aviso || "O líquido que não couber no tanque fica guardado no frasco aberto."}</span>`;

			const Cor = L ? L.Color : Verde;
			const Acao = $("acao");
			$("recarga").style.setProperty("--acao", Rgb(Cor));
			$("recarga").style.setProperty("--acao-texto", Claro(Cor) ? "#07110b" : "#ffffff");

			if (Despejando) {
				Acao.disabled = true;
				Acao.innerHTML = `${Icone.gota}Despejando...`;
			} else if (!Aberto) {
				$("recarga").style.setProperty("--acao", Rgb(Verde));
				$("recarga").style.setProperty("--acao-texto", "#ffffff");
				Acao.disabled = !V;
				Acao.innerHTML = `${Icone.abrir}Abrir bocal`;
			} else if (!L) {
				Acao.disabled = true;
				Acao.innerHTML = `${Icone.gota}Escolha um frasco`;
			} else {
				Acao.disabled = !S.Pode;
				Acao.innerHTML = `${Icone.gota}${S.Pode ? `Despejar ${Fmt(S.Despeja)} ml de ${L.Name}` : `Despejar ${L.Name}`}`;
			}
		}

		function Desenhar() {
			if (!Estacao) return;
			RenderVapes();
			RenderFrascos();
			RenderPalco();
			RenderRodape();
		}

		function AlternarBocal() {
			if (Despejando || !Vape()) return;
			Aberto = !Aberto;
			Desenhar();
		}

		function Inclinar(Rx, Ry) {
			$("modelo").style.setProperty("--rx", Rx + "deg");
			$("modelo").style.setProperty("--ry", Ry + "deg");
		}

		// o frasco voa até o bocal aberto, inclina e o jato enche o tanque
		function Despejar() {
			const V = Vape(), L = Frasco(), S = Situacao();
			if (!Aberto || !S.Pode || Despejando) return;

			Despejando = true;
			Inclinar(0, 0);
			RenderPalco();
			RenderRodape();

			const Palco = $("palco");
			const Caixa = Palco.getBoundingClientRect();
			const Fator = Caixa.width / Palco.offsetWidth;
			const Svg = $("modelo").querySelector("svg").getBoundingClientRect();
			const Bx = (Svg.left + Svg.width / 2 - Caixa.left) / Fator;
			const By = (Svg.top + ModeloAtual.Abertura * (Svg.height / 320) - Caixa.top) / Fator;

			const Garrafa = $("garrafa");
			const Gx = Garrafa.offsetLeft + Garrafa.offsetWidth / 2;
			const Gy = Garrafa.offsetTop;
			const Alvo = { x: Bx + 6, y: By - 44 };
			Palco.classList.add("despejando");
			Garrafa.classList.add("despejando");
			Garrafa.style.transform = `translate(${Alvo.x - Gx}px, ${Alvo.y - Gy}px) rotate(-104deg)`;

			const Jato = $("jato");
			Jato.style.left = `${Alvo.x - 2.5}px`;
			Jato.style.top = `${Alvo.y}px`;
			Jato.style.height = `${By - Alvo.y + 6}px`;

			setTimeout(() => Jato.classList.add("ativo"), 650);
			setTimeout(() => {
				Nivel((V.Ml + S.Despeja) / V.Capacity, L.Color, V.Ml + S.Despeja);
				Previa(0, 0);
				const Liquido = document.getElementById("b-liq");
				if (Liquido) Liquido.style.transform = `translateY(${(1 - Math.max(0, Disponivel(L) - S.Despeja) / Estacao.Bottle) * 88}px)`;
			}, 800);
			setTimeout(() => {
				Jato.classList.remove("ativo");
				Garrafa.style.transform = "";
				Garrafa.classList.remove("despejando");
				Palco.classList.remove("despejando");
			}, 2300);

			Post("Pour", { Vape: V.Item, Item: L.Item });

			// se o servidor recusar e não responder, destrava
			clearTimeout(Trava);
			Trava = setTimeout(() => { Despejando = false; Desenhar(); }, 5000);
		}

		$("palco").addEventListener("mousemove", (Evento) => {
			if (Despejando) return;
			const Caixa = $("palco").getBoundingClientRect();
			const X = (Evento.clientX - Caixa.left) / Caixa.width - 0.5;
			const Y = (Evento.clientY - Caixa.top) / Caixa.height - 0.5;
			Inclinar(Y * -12, X * 30);
		});
		$("palco").addEventListener("mouseleave", () => Inclinar(0, 0));
		$("garrafa").addEventListener("click", Despejar);
		$("acao").addEventListener("click", () => (Aberto ? Despejar() : AlternarBocal()));

		function AbrirRecarga(Data) {
			Estacao = Data;
			const Primeiro = Data.Vapes.find((V) => V.Item === Data.Selected) || Data.Vapes.find((V) => V.Ml < V.Capacity) || Data.Vapes[0];
			VapeSel = Primeiro ? Primeiro.Item : null;
			FrascoSel = Data.Liquid || null;
			Aberto = false;
			Despejando = false;

			const Chip = $("modo-mistura");
			Chip.className = "chip" + (Data.AllowMix ? "" : " desligado");
			Chip.innerHTML = `${Icone.mistura}${Data.AllowMix ? "Mistura liberada" : "Sem mistura"}`;

			MontarVape(Primeiro ? Primeiro.Style : "classic");
			Inclinar(0, 0);
			$("recarga").classList.add("aberto");
			Desenhar();
		}

		// depois de despejar: atualiza tudo sem fechar
		function AtualizarRecarga(Data) {
			Estacao = Data;
			Despejando = false;
			clearTimeout(Trava);
			if (!Data.Vapes.find((V) => V.Item === VapeSel) && Data.Vapes[0]) {
				VapeSel = Data.Vapes[0].Item;
				MontarVape(Data.Vapes[0].Style);
			}
			Desenhar();
		}

		function FecharRecarga() {
			$("recarga").classList.remove("aberto");
			Estacao = null;
			VapeSel = null;
			FrascoSel = null;
			Despejando = false;
		}

		$("fechar").addEventListener("click", () => {
			Post("Close");
			FecharRecarga();
		});

		document.addEventListener("keydown", (Evento) => {
			if (!Estacao) return;
			if (Evento.key === "Escape") {
				Post("Close");
				FecharRecarga();
			} else if (Evento.key === "Enter" && !$("acao").disabled) {
				$("acao").click();
			}
		});

		window.addEventListener("message", ({ data }) => {
			if (data.Action === "Show") $("vape").classList.add("aberto");
			else if (data.Action === "Hide") $("vape").classList.remove("aberto");
			else if (data.Action === "Update") Atualizar(data);
			else if (data.Action === "OpenRefill") AbrirRecarga(data);
			else if (data.Action === "UpdateRefill") AtualizarRecarga(data);
			else if (data.Action === "CloseRefill") FecharRecarga();
			else if (data.Action === "PuffStart") TocarPuxada(data.Volume);
			else if (data.Action === "PuffStop") PararPuxada();
		});
	</script>
</body>
</html>
